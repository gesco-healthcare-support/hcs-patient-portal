# Access log WITHOUT the query string or the referer (B10).
#
# The stock nginx.conf logs format `main`, whose $request carries the query string and whose
# $http_referer carries the previous page's full URL. Query strings here carry patient search fields,
# the booking lookup's email and the one-time tokens in emailed links. $uri is the path alone.
#
# EVERY server block below repeats `access_log ... portal_noquery;` on purpose. The stock nginx.conf
# declares `access_log ... main` at http level; a second http-level directive would ADD a log rather
# than replace it, and a server block with no access_log of its own silently inherits `main`.
# tests/python/test_nginx_access_log.py fails if a block is added without the line.
log_format portal_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent" "$http_x_forwarded_for" $host $request_time';

server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    access_log /var/log/nginx/access.log portal_noquery;

    # SECURITY HEADERS (SPA origin). nginx does NOT inherit add_header into a location that declares
    # its own, and every location below declares Cache-Control, so the set is REPEATED in each one.
    # tests/python/test_spa_security_headers.py fails if a location drops it. `always` so error
    # responses carry them too.
    #   X-Frame-Options DENY    clickjacking on approve / reject / reschedule. No page frames the SPA.
    #   Referrer-Policy         same-origin: emailed links carry one-time tokens in the query, and the
    #                           office subdomain is not for Google Fonts or Smarty to learn.
    #   Permissions-Policy      the app uses none of these; deny so injected script cannot ask.
    #   Content-Security-Policy-Report-Only is added by the reverse proxy, which knows BASE_DOMAIN.

    # Content-hashed build assets (main-<hash>.js, chunk-<hash>.js, polyfills-<hash>.js,
    # styles-<hash>.css, *-<hash>.css). The 8-char hash is the cache key and changes on
    # every rebuild, so pin these forever; `immutable` also skips needless revalidation.
    # `always` so the header is emitted on 304s too.
    location ~ "-[A-Z0-9]{8}\.(?:js|css)$" {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Runtime config the SPA reads at boot -- must always reflect the current deploy, so
    # revalidate every load (no-cache = revalidate, not "do not store").
    location = /dynamic-env.json {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ABP env-config alias that also serves the runtime config; preserve its CORS headers.
    location = /getEnvConfig {
        default_type 'application/json';
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Content-Type' 'application/json' always;
        add_header 'Cache-Control' 'no-cache' always;
        try_files $uri /dynamic-env.json;
    }

    # SPA shell + client-side routes + unhashed CSS bundles + favicon. index.html and the
    # unhashed bundles keep their names across rebuilds, so revalidate every load (cheap 304
    # via ETag) and fall back to index.html for deep links.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html =404;
    }

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    }
}
