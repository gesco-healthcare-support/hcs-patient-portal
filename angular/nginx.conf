server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    #access_log  /var/log/nginx/host.access.log  main;

    # Content-hashed build assets (main-<hash>.js, chunk-<hash>.js, polyfills-<hash>.js,
    # styles-<hash>.css, *-<hash>.css). The 8-char hash is the cache key and changes on
    # every rebuild, so pin these forever; `immutable` also skips needless revalidation.
    # `always` so the header is emitted on 304s too.
    location ~ "-[A-Z0-9]{8}\.(?:js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Runtime config the SPA reads at boot -- must always reflect the current deploy, so
    # revalidate every load (no-cache = revalidate, not "do not store").
    location = /dynamic-env.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ABP env-config alias that also serves the runtime config; preserve its CORS headers.
    location = /getEnvConfig {
        default_type 'application/json';
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Content-Type' 'application/json' always;
        add_header 'Cache-Control' 'no-cache' always;
        try_files $uri /dynamic-env.json;
    }

    # SPA shell + client-side routes + unhashed CSS bundles + favicon. index.html and the
    # unhashed bundles keep their names across rebuilds, so revalidate every load (cheap 304
    # via ETag) and fall back to index.html for deep links.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html =404;
    }

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
    }
}
