approvedGitRepositories:
  - "**"

# Yarn 4.14.0 (2026-04-16) made this the DEFAULT. This repo pins 4.16.0, which
# is after that release, and carried an explicit `true` from the first commit of
# this file (5f59ee76, 2026-06-13) -- so it was written into a NEW file rather
# than preserved across an upgrade. No prior deliberate decision is being
# overridden here (#723).
#
# With it true, a preinstall/install/postinstall in ANY package in the tree runs
# in CI, in the Docker image build, and on every developer machine -- the
# propagation path the Shai-Hulud npm worm family uses.
#
# MEASURED BEFORE FLIPPING, not flipped and watched. Five packages out of 2,469
# in this tree declare an install lifecycle script:
#
#   @parcel/watcher                2.5.6    install       native binding
#   esbuild                        0.28.0   postinstall   platform binary
#   lmdb                           3.4.2    install       native binding
#   msgpackr-extract               3.0.3    install       native binding
#   ljharb-monorepo-symlink-test   0.0.0    postinstall   test fixture
#
# NO `dependenciesMeta` BLOCK IS NEEDED, and that is a measured result rather
# than an omission. All four real packages ship prebuilt platform binaries as
# optional dependencies under the node-modules linker, so their scripts are a
# no-op here; the fifth is a transitive test fixture. Proven by deleting
# node_modules entirely and reinstalling with this setting:
#
#   yarn install                       exit 0
#   ng build --configuration development   exit 0
#   ng test --watch=false              995/995 passing
#
# If a future dependency genuinely needs its script, the fix is a targeted
# `dependenciesMeta.<pkg>.built: true` entry HERE -- not flipping this back.
enableScripts: false

httpRetry: 5

httpTimeout: 600000

nodeLinker: node-modules

npmMinimalAgeGate: 0

yarnPath: .yarn/releases/yarn-4.16.0.cjs
