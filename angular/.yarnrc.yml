approvedGitRepositories:
  - "**"

# Yarn 4.14.0 (2026-04-16) made this the DEFAULT. This repo pins 4.16.0, which
# is after that release, and carried an explicit `true` from the first commit of
# this file (5f59ee76, 2026-06-13) -- so it was written into a NEW file rather
# than preserved across an upgrade. No prior deliberate decision is being
# overridden here (#723).
#
# With it true, a preinstall/install/postinstall in ANY package in the tree runs
# in CI, in the Docker image build, and on every developer machine -- the
# propagation path the Shai-Hulud npm worm family uses.
#
# MEASURED BEFORE FLIPPING, not flipped and watched. Five packages out of 2,469
# in this tree declare an install lifecycle script:
#
#   @parcel/watcher                2.5.6    install       native binding
#   esbuild                        0.28.0   postinstall   platform binary
#   lmdb                           3.4.2    install       native binding
#   msgpackr-extract               3.0.3    install       native binding
#   ljharb-monorepo-symlink-test   0.0.0    postinstall   test fixture
#
# NO `dependenciesMeta` BLOCK IS NEEDED, and that is a measured result rather
# than an omission. All four real packages ship prebuilt platform binaries as
# optional dependencies under the node-modules linker, so their scripts are a
# no-op here; the fifth is a transitive test fixture. Proven by deleting
# node_modules entirely and reinstalling with this setting:
#
#   yarn install                       exit 0
#   ng build --configuration development   exit 0
#   ng test --watch=false              995/995 passing
#
# If a future dependency genuinely needs its script, the fix is a targeted
# `dependenciesMeta.<pkg>.built: true` entry HERE -- not flipping this back.
enableScripts: false

httpRetry: 5

httpTimeout: 600000

nodeLinker: node-modules

# Minimum publish age a version must reach before Yarn will resolve it.
#
# WAS 0, WHICH IS OFF -- and 0 is not "unset". Yarn 4.16.0's own default is "1d",
# so this file was actively DISABLING a protection Yarn enables out of the box.
# Read from the pinned binary rather than the docs, because the docs do not state
# the default: .yarn/releases/yarn-4.16.0.cjs declares
#   npmMinimalAgeGate: { type: "DURATION", unit: "m", default: "1d" }
# so a bare number is MINUTES, and suffixed forms (s/m/h/d/w) parse too.
#
# WHY 3d, and it is Yarn's own stated reason rather than a round number. The
# setting exists "to reduce the likelihood of installing compromised packages, or
# to avoid relying on packages that could still be unpublished (e.g. the npm
# registry has specific rules for packages less than 3 days old)". npm permits a
# version to be unpublished within 72 hours, so anything younger than that can
# vanish and take a reproducible install with it. 3d is the first value where
# that stops being possible.
#
# TAKING AN URGENT PATCH SOONER, which is a real need and has a supported answer:
# add the exact descriptor to `npmPreapprovedPackages` below, install, then REMOVE
# it again in the same change. Yarn declares that setting as
#   "Array of package descriptors or package name glob patterns to exclude from
#    the minimum release age check"  (type STRING, isArray, default [])
# Keep it empty in the committed state -- a standing entry is a permanent hole,
# and the whole value of this gate is that the exception is visible in a diff.
#
# This does NOT retroactively affect yarn.lock: the gate is applied when RESOLVING
# a version, so an install against an existing lockfile is unaffected. It bites on
# `yarn up` / `yarn add`, which is where a freshly published bad version would
# otherwise enter.
npmMinimalAgeGate: 3d

npmPreapprovedPackages: []

yarnPath: .yarn/releases/yarn-4.16.0.cjs
