<div class="ra-scrim" (click)="cancelled.emit()">
  <div class="ra-modal ra-modal--xl" (click)="$event.stopPropagation()">
    <div class="ra-modal__head">
      <h3>{{ draft().id ? 'Edit ' + section.singular : 'New ' + section.singular }}</h3>
      <button type="button" class="x" (click)="cancelled.emit()">
        <app-icon name="x" [size]="17" />
      </button>
    </div>
    <div class="ra-modal__body">
      <div class="ra-grid">
        <div class="ra-field col-6">
          <label for="pem-patient-first-name">
            First name
            <span class="req">*</span>
          </label>
          <input
            id="pem-patient-first-name"
            class="ra-input"
            placeholder="First name"
            [ngModel]="draft().firstName"
            (ngModelChange)="patch({ firstName: $event })"
          />
        </div>
        <div class="ra-field col-6">
          <label for="pem-patient-last-name">
            Last name
            <span class="req">*</span>
          </label>
          <input
            id="pem-patient-last-name"
            class="ra-input"
            placeholder="Last name"
            [ngModel]="draft().lastName"
            (ngModelChange)="patch({ lastName: $event })"
          />
        </div>

        @if (section.isPatient) {
          <div class="ra-field col-6">
            <label for="pem-patient-middle-name">Middle name</label>
            <input
              id="pem-patient-middle-name"
              class="ra-input"
              placeholder="Middle name"
              [ngModel]="draft().middleName"
              (ngModelChange)="patch({ middleName: $event })"
            />
          </div>
          <div class="ra-field col-6">
            <label for="pem-patient-gender-id">Gender</label>
            <select
              id="pem-patient-gender-id"
              class="ra-select"
              [ngModel]="draft().genderId"
              (ngModelChange)="patch({ genderId: $event })"
            >
              <option [ngValue]="null">--</option>
              @for (g of genders; track g.value) {
                <option [ngValue]="g.value">{{ g.key }}</option>
              }
            </select>
          </div>
          <div class="ra-field col-6">
            <label for="pem-patient-date-of-birth">Date of birth</label>
            <input
              id="pem-patient-date-of-birth"
              class="ra-input"
              type="date"
              [ngModel]="draft().dateOfBirth"
              (ngModelChange)="patch({ dateOfBirth: $event })"
            />
          </div>
          <div class="ra-field col-6">
            <label for="pem-patient-email">Email</label>
            <input
              id="pem-patient-email"
              class="ra-input"
              type="email"
              placeholder="name@example.com"
              [ngModel]="draft().email"
              (ngModelChange)="patch({ email: $event })"
            />
          </div>
          <div class="ra-field col-6">
            <label for="pem-patient-phone-number">Phone</label>
            <input
              id="pem-patient-phone-number"
              appPhoneNumber
              class="ra-input"
              placeholder="(555) 555-0100"
              [ngModel]="draft().phoneNumber"
              (ngModelChange)="patch({ phoneNumber: $event })"
            />
          </div>
          <div class="ra-field col-6">
            <label for="pem-patient-cell-phone-number">Cell phone</label>
            <input
              id="pem-patient-cell-phone-number"
              appPhoneNumber
              class="ra-input"
              placeholder="(555) 555-0100"
              [ngModel]="draft().cellPhoneNumber"
              (ngModelChange)="patch({ cellPhoneNumber: $event })"
            />
          </div>
          <div class="ra-field col-6">
            <label for="pem-patient-phone-number-type-id">Phone type</label>
            <select
              id="pem-patient-phone-number-type-id"
              class="ra-select"
              [ngModel]="draft().phoneNumberTypeId"
              (ngModelChange)="patch({ phoneNumberTypeId: $event })"
            >
              <option [ngValue]="null">--</option>
              @for (p of phoneTypes; track p.value) {
                <option [ngValue]="p.value">{{ p.key }}</option>
              }
            </select>
          </div>
          <div class="ra-field col-12">
            <label for="pem-patient-social-security-number">Social Security #</label>
            <input
              id="pem-patient-social-security-number"
              class="ra-input"
              autocomplete="off"
              placeholder="Enter to replace -- stored securely, shown masked. Blank keeps the current value."
              [ngModel]="draft().socialSecurityNumber"
              (ngModelChange)="patch({ socialSecurityNumber: $event })"
            />
          </div>
          <div class="ra-field col-6">
            <label for="pem-patient-street">Street</label>
            <input
              id="pem-patient-street"
              class="ra-input"
              placeholder="Street address"
              [ngModel]="draft().street"
              (ngModelChange)="patch({ street: $event })"
            />
          </div>
          <div class="ra-field col-6">
            <label for="pem-patient-city">City</label>
            <input
              id="pem-patient-city"
              class="ra-input"
              placeholder="City"
              [ngModel]="draft().city"
              (ngModelChange)="patch({ city: $event })"
            />
          </div>
          <div class="ra-field col-6">
            <label for="pem-patient-state-id">State</label>
            <select
              id="pem-patient-state-id"
              class="ra-select"
              [ngModel]="draft().stateId"
              (ngModelChange)="patch({ stateId: $event })"
            >
              <option [ngValue]="''">--</option>
              @for (s of states; track s.id) {
                <option [ngValue]="s.id">{{ s.name }}</option>
              }
            </select>
          </div>
          <div class="ra-field col-6">
            <label for="pem-patient-zip-code">Zip code</label>
            <input
              id="pem-patient-zip-code"
              class="ra-input"
              placeholder="ZIP code"
              [ngModel]="draft().zipCode"
              (ngModelChange)="patch({ zipCode: $event })"
            />
          </div>
          <div class="ra-field col-6">
            <label for="pem-patient-appointment-language-id">Appointment language</label>
            <select
              id="pem-patient-appointment-language-id"
              class="ra-select"
              [ngModel]="draft().appointmentLanguageId"
              (ngModelChange)="patch({ appointmentLanguageId: $event })"
            >
              <option [ngValue]="''">--</option>
              @for (l of languages; track l.id) {
                <option [ngValue]="l.id">{{ l.name }}</option>
              }
            </select>
          </div>
          <div class="ra-field col-6">
            <label for="pem-patient-others-language-name">Other language</label>
            <input
              id="pem-patient-others-language-name"
              class="ra-input"
              placeholder="Other language"
              [ngModel]="draft().othersLanguageName"
              (ngModelChange)="patch({ othersLanguageName: $event })"
            />
          </div>
          <div class="ra-field col-6">
            <label for="pem-patient-interpreter-vendor-name">Interpreter vendor</label>
            <input
              id="pem-patient-interpreter-vendor-name"
              class="ra-input"
              placeholder="Interpreter vendor"
              [ngModel]="draft().interpreterVendorName"
              (ngModelChange)="patch({ interpreterVendorName: $event })"
            />
          </div>
          <div class="ra-field col-6">
            <label for="pem-patient-appt-number">Appt #</label>
            <input
              id="pem-patient-appt-number"
              class="ra-input"
              placeholder="Appointment number"
              [ngModel]="draft().apptNumber"
              (ngModelChange)="patch({ apptNumber: $event })"
            />
          </div>
        } @else if (section.hasFirm) {
          <div class="ra-field col-6">
            <label for="pem-firm-firm-name">Firm name</label>
            <input
              id="pem-firm-firm-name"
              class="ra-input"
              placeholder="Firm name"
              [ngModel]="draft().firmName"
              (ngModelChange)="patch({ firmName: $event })"
            />
          </div>
          <div class="ra-field col-8">
            <label for="pem-firm-firm-address">Firm address</label>
            <input
              id="pem-firm-firm-address"
              class="ra-input"
              placeholder="Street, city, state, ZIP"
              [ngModel]="draft().firmAddress"
              (ngModelChange)="patch({ firmAddress: $event })"
            />
          </div>
          <div class="ra-field col-6">
            <label for="pem-firm-email">Email</label>
            <input
              id="pem-firm-email"
              class="ra-input"
              type="email"
              placeholder="name@example.com"
              [ngModel]="draft().email"
              (ngModelChange)="patch({ email: $event })"
            />
          </div>
          <div class="ra-field col-6">
            <label for="pem-firm-phone-number">Phone</label>
            <input
              id="pem-firm-phone-number"
              appPhoneNumber
              class="ra-input"
              placeholder="(555) 555-0100"
              [ngModel]="draft().phoneNumber"
              (ngModelChange)="patch({ phoneNumber: $event })"
            />
          </div>
          <div class="ra-field col-6">
            <label for="pem-firm-fax-number">Fax</label>
            <input
              id="pem-firm-fax-number"
              appPhoneNumber
              class="ra-input"
              placeholder="(555) 555-0100"
              [ngModel]="draft().faxNumber"
              (ngModelChange)="patch({ faxNumber: $event })"
            />
          </div>
        } @else {
          <div class="ra-field col-12">
            <label for="pem-contact-email">Email</label>
            <input
              id="pem-contact-email"
              class="ra-input"
              type="email"
              placeholder="name@example.com"
              [ngModel]="draft().email"
              (ngModelChange)="patch({ email: $event })"
            />
          </div>
          <div class="ra-field col-6">
            <label for="pem-contact-phone-number">Phone</label>
            <input
              id="pem-contact-phone-number"
              appPhoneNumber
              class="ra-input"
              placeholder="(555) 555-0100"
              [ngModel]="draft().phoneNumber"
              (ngModelChange)="patch({ phoneNumber: $event })"
            />
          </div>
          <div class="ra-field col-6">
            <label for="pem-contact-fax-number">Fax</label>
            <input
              id="pem-contact-fax-number"
              appPhoneNumber
              class="ra-input"
              placeholder="(555) 555-0100"
              [ngModel]="draft().faxNumber"
              (ngModelChange)="patch({ faxNumber: $event })"
            />
          </div>
        }
      </div>
    </div>
    <div class="ra-modal__foot">
      <button type="button" class="af-btn af-btn--ghost" (click)="cancelled.emit()">Cancel</button>
      <button type="button" class="af-btn af-btn--primary" [disabled]="busy" (click)="onSave()">
        <app-icon name="check" [size]="15" />
        Save
      </button>
    </div>
  </div>
</div>
