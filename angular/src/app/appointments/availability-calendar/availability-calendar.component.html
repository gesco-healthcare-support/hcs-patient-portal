<!--
  Phase 4a (2026-08-03). Markup lifted from appointment-add-schedule.component.html's date + time
  columns so the rendered result is unchanged for booking. Differences are only in wiring: the input
  is no longer `formControlName`-bound (this component is controlled, so the parent owns the form),
  and the day template asks THIS component whether a date has availability.

  The label/input `id`s are LITERAL, matching the repo convention (see appointment-detail) and
  satisfying the static label-association check. That assumes ONE instance per rendered page, which
  holds today (booking renders one; the 4b reschedule modal opens over pages that render none). If a
  host ever shows two calendars at once, these ids must become per-instance or they will collide.
-->
<div class="row">
  <div class="col-md-6 mb-3">
    <label class="form-label fw-semibold" for="availability-calendar-date">{{ dateLabel }} *</label>
    <div class="input-group">
      <input
        readonly
        class="form-control"
        id="availability-calendar-date"
        [class.is-invalid]="dateInvalid"
        [formControl]="dateControl"
        name="availabilityDate"
        ngbDatepicker
        #datePicker="ngbDatepicker"
        [displayMonths]="2"
        [markDisabled]="markDateDisabled"
        [dayTemplate]="dayTpl"
        (click)="datePicker.open()"
      />
      <button class="btn btn-outline-secondary" type="button" (click)="datePicker.open()">
        <i class="fa fa-calendar"></i>
      </button>
      @if (selectedDate) {
        <button class="btn btn-outline-secondary" type="button" (click)="onClear()">
          <i class="fa fa-times"></i>
        </button>
      }
    </div>

    <ng-template #dayTpl let-date="date" let-currentMonth="currentMonth" let-selected="selected">
      <span
        class="appointment-date-day"
        [class.outside-month]="date.month !== currentMonth"
        [class.selected-day]="selected"
        [class.available-day]="date.month === currentMonth && !selected && isAvailableDate(date)"
      >
        {{ date.day }}
      </span>
    </ng-template>

    @if (isLoading) {
      <small class="text-muted">Loading available dates...</small>
    }
    @if (!isLoading && selectedDate) {
      <small class="text-muted">{{ minimumBookingRuleMessage }}</small>
    }
    @if (noDatesMessage) {
      <small class="text-warning d-block mt-1">{{ noDatesMessage }}</small>
    }
  </div>

  <div class="col-md-6 mb-3">
    <label class="form-label fw-semibold" for="availability-calendar-time">{{ timeLabel }} *</label>
    <select
      class="form-select"
      id="availability-calendar-time"
      [class.is-invalid]="timeInvalid"
      [formControl]="timeControl"
      name="availabilityTime"
    >
      <option [ngValue]="null">SELECT</option>
      @for (slot of timeOptions; track slot.value) {
        <option [value]="slot.value">{{ slot.label }}</option>
      }
    </select>
    @if (selectedDate && !isLoading && timeOptions.length === 0) {
      <small class="text-danger">{{ noSlotsMessage }}</small>
    }
  </div>
</div>
