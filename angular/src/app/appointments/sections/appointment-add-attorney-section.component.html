<!-- #121 phase T5 (2026-05-13) -- shared Applicant Attorney / Defense
     Attorney card. Parent gates visibility via shouldShow*Section()
     so the child renders unconditionally when mounted. The 12
     FormControls live on the parent's `form`; child binds
     [formGroup]="form" so formControlName resolves at parent scope.
     Section-specific prefix + readonly + ids come from Inputs. -->
<div [formGroup]="form" class="card mb-4">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="card-title mb-0 fw-bold">{{ headingText }}</h5>
    <!-- Item 5 (2026-08-18): an explicit question with no pre-selected answer, replacing a
         checkbox labelled "Include". "Include" conflated "show me this section" with "this
         appointment has an attorney", so a default answered a question nobody was asked.
         Radios rather than a switch because the control now has THREE meanings -- yes, no, and
         not-yet-answered -- and an unchecked switch cannot tell the last two apart.
         Hidden entirely when `mandatory`: the viewer IS this attorney type, so there is
         nothing to ask. -->
    @if (!mandatory) {
      <fieldset class="d-flex align-items-center gap-3 mb-0">
        <legend class="form-label fw-semibold mb-0 fs-6 float-none w-auto">
          {{ questionText }}
        </legend>
        <div class="form-check form-check-inline mb-0">
          <input
            class="form-check-input"
            type="radio"
            [id]="checkboxId + '-yes'"
            [formControlName]="prefix + 'Enabled'"
            [value]="true"
          />
          <label class="form-check-label" [for]="checkboxId + '-yes'">Yes</label>
        </div>
        <div class="form-check form-check-inline mb-0">
          <input
            class="form-check-input"
            type="radio"
            [id]="checkboxId + '-no'"
            [formControlName]="prefix + 'Enabled'"
            [value]="false"
          />
          <label class="form-check-label" [for]="checkboxId + '-no'">No</label>
        </div>
      </fieldset>
    }
  </div>
  @if (mandatory || form.get(prefix + 'Enabled')?.value) {
    <div class="card-body">
      <div class="row">
        <div class="col-md-3 mb-3">
          <label class="form-label fw-semibold">First Name *</label>
          <input
            class="form-control"
            [formControlName]="prefix + 'FirstName'"
            placeholder="FIRST NAME"
            maxlength="50"
            [class.is-invalid]="isFieldInvalid(prefix + 'FirstName')"
          />
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label fw-semibold">Last Name *</label>
          <input
            class="form-control"
            [formControlName]="prefix + 'LastName'"
            placeholder="LAST NAME"
            maxlength="50"
            [class.is-invalid]="isFieldInvalid(prefix + 'LastName')"
          />
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label fw-semibold">Email *</label>
          <input
            type="email"
            class="form-control"
            [formControlName]="prefix + 'Email'"
            placeholder="ATTORNEY EMAIL"
            [readonly]="isReadOnly"
            [class.is-invalid]="isFieldInvalid(prefix + 'Email')"
          />
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label fw-semibold">Firm Name *</label>
          <input
            class="form-control"
            [formControlName]="prefix + 'FirmName'"
            placeholder="FIRM NAME"
            maxlength="50"
            [class.is-invalid]="isFieldInvalid(prefix + 'FirmName')"
          />
          <!-- BUG-012 (2026-05-22): inline feedback for the
               server-and-client-required Firm Name. The .invalid-feedback
               element is shown by Bootstrap automatically when its
               sibling input carries .is-invalid. Mirrors the asterisk
               in the label so the user knows WHY the field is flagged. -->
          @if (
            form.get(prefix + 'FirmName')?.hasError('required') &&
            form.get(prefix + 'FirmName')?.touched
          ) {
            <div class="invalid-feedback d-block">Firm Name is required.</div>
          }
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label fw-semibold">Website</label>
          <input
            class="form-control"
            [formControlName]="prefix + 'WebAddress'"
            placeholder="WEBSITE"
            maxlength="100"
          />
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label fw-semibold">Phone Number *</label>
          <input
            class="form-control"
            [formControlName]="prefix + 'PhoneNumber'"
            placeholder="PHONE NUMBER"
            maxlength="20"
            [class.is-invalid]="isFieldInvalid(prefix + 'PhoneNumber')"
          />
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label fw-semibold">Fax</label>
          <input
            class="form-control"
            [formControlName]="prefix + 'FaxNumber'"
            placeholder="FAX"
            maxlength="19"
            [class.is-invalid]="isFieldInvalid(prefix + 'FaxNumber')"
          />
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label fw-semibold">Street *</label>
          <!-- F2 (2026-05-29): autocomplete fills street/city/state/zip. -->
          <app-address-autocomplete
            [group]="form"
            [fields]="addressFields"
            placeholder="STREET"
          ></app-address-autocomplete>
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label fw-semibold">City *</label>
          <input
            class="form-control"
            [formControlName]="prefix + 'City'"
            placeholder="CITY"
            maxlength="50"
            [class.is-invalid]="isFieldInvalid(prefix + 'City')"
          />
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label fw-semibold">State *</label>
          <app-lookup-select
            [cid]="stateSelectCid"
            [formControlName]="prefix + 'StateId'"
            [getFn]="getStateLookup"
            [class.is-invalid]="isFieldInvalid(prefix + 'StateId')"
          ></app-lookup-select>
        </div>
        <div class="col-md-3 mb-3">
          <label class="form-label fw-semibold">Zip *</label>
          <input
            class="form-control"
            [formControlName]="prefix + 'ZipCode'"
            placeholder="ZIP"
            maxlength="10"
            [class.is-invalid]="isFieldInvalid(prefix + 'ZipCode')"
          />
        </div>
      </div>
    </div>
  }
</div>
