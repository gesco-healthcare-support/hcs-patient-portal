<abp-modal [busy]="isBusy" [visible]="visible" (visibleChange)="setVisible($event)" size="md">
  <ng-template #abpHeader>
    <div>
      <h3 class="modal-title text-white mb-1">Approve appointment request</h3>
      <h6 class="my-1 text-white">Please approve an appointment request from here.</h6>
    </div>
  </ng-template>

  <ng-template #abpBody>
    <form [formGroup]="form">
      <div class="form-group mb-3">
        <label for="approve-comments" class="form-label">Any comments?</label>
        <textarea
          id="approve-comments"
          class="form-control"
          rows="3"
          formControlName="internalUserComments"
          placeholder="Please enter comments regarding this appointment"
          aria-describedby="approve-comments-hint"
        ></textarea>
        <!-- 2026-10-27: the comment is printed in the approval email every party receives. -->
        <div id="approve-comments-hint" class="form-text">
          Included in the approval email to everyone on the case.
        </div>
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" abpClose>Close</button>
    <abp-button
      iconClass="fa fa-check"
      buttonType="button"
      [disabled]="approveDisabled"
      (click)="confirm()"
    >
      Approve
    </abp-button>
  </ng-template>
</abp-modal>
