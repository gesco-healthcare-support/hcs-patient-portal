name: Docs site

# Builds the MkDocs site on every documentation change and checks that nothing excluded from it
# was published. It does NOT publish today.
#
# WHY IT IS A SEPARATE WORKFLOW
# Publishing to GitHub Pages needs `pages: write` and `id-token: write`. Keeping the site here
# means those scopes can never reach the main pipeline in ci.yml, and OpenSSF Scorecard sees them
# on one job only.
#
# WHY PUBLISHING IS HELD OFF
# The repository is public and GitHub Pages is not enabled. Whether to publish is the portal
# maintainer's decision, not this workflow's. Until then the `deploy` job, and the Pages artifact
# upload it needs, are skipped unless the repository variable DOCS_SITE_PUBLISH is exactly "true".
# The variable does not exist, so nothing is uploaded or deployed.
#
# TO SWITCH PUBLISHING ON, in this order:
#   1. Settings > Pages > Source: "GitHub Actions".
#   2. Settings > Secrets and variables > Actions > Variables: DOCS_SITE_PUBLISH = true.
#   The next push to main that touches the docs then deploys. To switch it off again, delete the
#   variable; the site stays up until Pages is disabled too.
#
# This check is not required: a docs-only change should not be blocked by the site build while
# it is not published. The link check in ci.yml stays the blocking docs gate.

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/docs-requirements.in"
      - ".github/docs-requirements.txt"
      - ".github/workflows/docs-site.yml"
      - "scripts/docs/**"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/docs-requirements.in"
      - ".github/docs-requirements.txt"
      - ".github/workflows/docs-site.yml"
      - "scripts/docs/**"
  workflow_dispatch:

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: "Docs: Build site"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the git-revision-date-localized plugin dates each page from its commits.
      # A shallow clone would stamp every page with the build date, and fallback_to_build_date
      # would hide that without a warning.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # Wheels only: no package may run a build script at install time. Hash-locked: every package,
      # including what the four tools pull in, is installed at the locked version and must match a
      # locked hash, so nothing resolves fresh on a run. See .github/docs-requirements.in.
      - name: Install MkDocs (locked)
        run: python -m pip install --require-hashes --only-binary ":all:" -r .github/docs-requirements.txt

      - name: Build (strict)
        run: mkdocs build --strict --site-dir site

      # The exclusion list lives in the script, independent of mkdocs.yml, so that deleting an
      # exclusion there fails the build instead of publishing silently. The server build of /docs/
      # (scripts/hosting/build-docs-site.sh) runs the same script, so there is one list.
      - name: Guard - nothing excluded reached the site
        run: sh scripts/docs/check-site-exclusions.sh site

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_SITE_PUBLISH == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: "Docs: Publish to Pages"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_SITE_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
