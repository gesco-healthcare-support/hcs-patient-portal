name: OpenSSF Scorecard

# Repo-level supply-chain security posture audit. Not per-PR (Scorecard
# measures repo-level properties like branch protection, pinned dependencies,
# signed releases, dangerous workflow patterns -- diff-level analysis doesn't
# make sense). Runs on push to main and weekly.
#
# Offset by 1 hour from security.yml to avoid runner contention.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'  # Monday 7 AM UTC
  workflow_dispatch:

# Least-privilege default (phase 2 item 2.3, 2026-09-03). Scorecard
# `TokenPermissionsID`: a workflow with no top-level block inherits the
# repository default, which is more than any job here needs.
#
# Every job in this file declares its own `permissions`, and a job-level block
# REPLACES this one rather than merging with it -- so this line cannot reduce
# any existing job's access. It sets the default for jobs added later.
permissions:
  contents: read

jobs:
  analysis:
    name: 'Scorecard: Analysis'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 14
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
