name: CI

on:
  pull_request:
    branches:
      [
        main,
        development,
        staging,
        production,
        chore/dependency-updates,
        "feat/**",
        "fix/**",
      ]
  # PUSHES TO `main` RUN THE SUITE TOO (2026-09-10).
  #
  # Until now this workflow was `pull_request`-only, so the three test-gating
  # required contexts -- Backend: Test, Frontend: Test, Coverage: Floors --
  # never ran against the trunk itself. On 2026-09-10 eleven pull requests
  # merged in seven minutes, each green against a `main` that did not contain
  # the other ten, and nothing tested the combined result.
  #
  # `sonarcloud.yml` did trigger on push and did run both suites, but it was
  # `continue-on-error: true` and neither of its contexts was required, so a
  # failure there gated nothing and notified nobody. (#1032 folded it into this
  # file as the `sonarcloud` job, which runs no suites of its own.) The only run anyone acted
  # on was the cascade PR's, whose head branch IS `main` -- the trunk was
  # validated incidentally, by a pull request that exists to promote it, and
  # closing that PR would have removed the coverage silently.
  #
  # `concurrency` below keys on `github.ref`, so a push run (`refs/heads/main`)
  # and a cascade PR run (`refs/pull/N/merge`) sit in DIFFERENT groups and do
  # not cancel each other. A rapid merge batch collapses to one push run
  # against the final state, which is the result worth having.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  changes:
    name: "Meta: Changed paths"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      shared: ${{ steps.classify.outputs.shared }}
      unclassified: ${{ steps.classify.outputs.unclassified }}
    steps:
      # DENY BY DEFAULT (phase 2 item 0.5, 2026-09-03).
      #
      # This replaced `dorny/paths-filter` with an explicit classifier for one
      # reason: the filters were an ALLOWLIST WITH NO CATCH-ALL. 28 tracked
      # top-level paths matched none of the three groups -- all three compose
      # files, `docker/`, `scripts/`, `tools/`, `etc/`, `BannedSymbols.txt`,
      # `.gitignore`, `.env.example` among them. A pull request touching only
      # those set every output to false, so every downstream job's `if:`
      # evaluated false and every job SKIPPED.
      #
      # A skipped job reports "Success" and does NOT block a merge, even when it
      # is a required check. So such a pull request satisfied every required
      # check on `main` and `development` -- where ALL required checks are
      # conditional on this job -- having run none of them.
      #
      # The `*)` arm below is the fix and it is the whole point: anything this
      # classifier does not RECOGNISE is treated as affecting everything, so the
      # full suite runs. A new top-level directory added next year is covered
      # without anyone remembering to come back here. An allowlist cannot
      # self-heal; a fallback can.
      #
      # Keep the genuine saving: a `src/`-only change still skips the frontend
      # jobs, and vice versa.
      - name: Classify the changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # A PUSH HAS NO PULL REQUEST TO CLASSIFY (2026-09-10).
          #
          # `github.event.pull_request` is null outside a pull request, so the
          # API path below would be malformed on a push and the guard beneath it
          # would exit 1 on EVERY push to `main`. The downstream jobs would still
          # run -- they guard with `always() && needs.changes.result != 'success'`
          # precisely so a classifier failure cannot skip them -- but this job
          # would be red on every push, and a check that is permanently red
          # teaches people to ignore the colour. That is worse than no check.
          #
          # On the trunk we want the entire suite regardless of what changed, so
          # state that instead of deriving it. Same deny-by-default rule as the
          # `*)` arm below, applied one level up.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            {
              echo "backend=true"
              echo "frontend=true"
              echo "shared=true"
              echo "unclassified=true"
            } >> "$GITHUB_OUTPUT"

            {
              echo "### Changed-path classification"
              echo ""
              echo "Event \`${{ github.event_name }}\` is not a pull request."
              echo "Running the full suite without classifying."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          files=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')

          # Absent input is a hard failure, never a silent pass. An empty list
          # here would classify everything as false and skip the whole suite --
          # exactly the defect this job was rewritten to remove.
          if [ -z "$files" ]; then
            echo "::error::No changed files reported for this pull request. Refusing to classify."
            exit 1
          fi

          backend=false
          frontend=false
          shared=false
          unclassified=false

          while IFS= read -r f; do
            case "$f" in
              src/* | test/* | *.sln | *.slnx | Directory.Build.props | \
              NuGet.Config.template | common.props | global.json)
                backend=true
                ;;
              angular/*)
                frontend=true
                ;;
              .github/* | docs/* | .editorconfig | .gitleaks.toml | \
              .markdownlint.json | README.md | CONTRIBUTING.md | CHANGELOG.md)
                shared=true
                ;;
              *)
                # Deny by default. Unrecognised path -> run everything.
                unclassified=true
                echo "unclassified path, will run the full suite: $f"
                ;;
            esac
          done <<< "$files"

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "shared=$shared"
            echo "unclassified=$unclassified"
          } >> "$GITHUB_OUTPUT"

          echo "### Changed-path classification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Group | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ----- | ----- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| backend | \`$backend\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| frontend | \`$frontend\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| shared | \`$shared\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| unclassified | \`$unclassified\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$files" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

  backend-build:
    name: "Backend: Build"
    runs-on: ubuntu-latest
    needs: changes
    # always(): the classifier's OWN failure must not skip this job. If it
    # cannot classify, run -- the same deny-by-default rule as `unclassified`.
    # KEEP IDENTICAL to backend-test-shard's `if:`, which copies it so the shards
    # need not wait for this job (they build for themselves).
    if: >-
      ${{ always() && (needs.changes.result != 'success'
      || needs.changes.outputs.backend == 'true'
      || needs.changes.outputs.shared == 'true'
      || needs.changes.outputs.unclassified == 'true') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/common.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Generate NuGet.Config
        run: sed "s/\${ABP_NUGET_API_KEY}/${{ secrets.ABP_NUGET_API_KEY }}/" NuGet.Config.template > NuGet.Config
      - name: Create placeholder secrets files (ABP requires these to build)
        run: |
          for dir in src/HealthcareSupport.CaseEvaluation.AuthServer \
                     src/HealthcareSupport.CaseEvaluation.HttpApi.Host \
                     src/HealthcareSupport.CaseEvaluation.DbMigrator \
                     test/HealthcareSupport.CaseEvaluation.TestBase \
                     test/HealthcareSupport.CaseEvaluation.HttpApi.Client.ConsoleTestApp; do
            if [ -n "${{ secrets.ABP_LICENSE_CODE }}" ]; then
              echo "{\"AbpLicenseCode\": \"${{ secrets.ABP_LICENSE_CODE }}\"}" > "$dir/appsettings.secrets.json"
            else
              echo '{}' > "$dir/appsettings.secrets.json"
            fi
          done
      # --locked-mode (#687): scan the graph we actually declare.
      #
      # packages.lock.json is committed so dependency-review can see transitive
      # NuGet packages, and Directory.Build.props says CI "can opt in via the
      # dotnet restore flag for locked mode". It never did. With the flag absent a
      # pull request could add a dependency, leave the lock file stale, and
      # Dependency Review -- a REQUIRED check -- would scan a graph without the new
      # packages in it and pass. That happened on #686: an added ProjectReference
      # pulled OpenIddict in transitively, the lock file had zero OpenIddict.Server
      # entries, and build, tests and git status were all clean.
      #
      # Now it is NU1004 instead: "The package references have changed ... restore
      # can't be run in locked mode". RestoreLockedMode stays FALSE locally, per the
      # existing reasoning, so day-to-day package tweaks are unaffected; the cost is
      # that a dependency change must be followed by
      # `dotnet restore --force-evaluate` and the lock files committed.
      - run: dotnet restore HealthcareSupport.CaseEvaluation.slnx --locked-mode
      # Phase 2.1 (2026-09-02): the separate informational `-warnaserror` build was
      # removed here, per its own instruction. It said to remove it once
      # Directory.Build.props set <TreatWarningsAsErrors>true</TreatWarningsAsErrors>,
      # which happened in Phase B-6 PR-0 (see Directory.Build.props:9,:21). The build
      # below therefore already enforces warnings-as-errors, so the extra step was a
      # duplicate full-solution build on every back-end submission.
      - run: dotnet build HealthcareSupport.CaseEvaluation.slnx --no-restore -c Release

      # PHASE 2 ITEM 2.6 -- fail the build on a model change with no migration.
      #
      # Pinned to the version the mechanism was actually verified with, not to
      # "latest". Newer 10.0.x exist; an unpinned tool means the gate's behaviour
      # can change without anyone changing this file.
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.7

      # TWO STEPS, ONE PER CONTEXT, DELIBERATELY NEVER COMBINED.
      #
      # This repo has two schemas: `CaseEvaluationDbContext` (host, Migrations/)
      # and `CaseEvaluationTenantDbContext` (tenant, TenantMigrations/, one
      # database per office). Most entities are mapped in BOTH.
      #
      # A single combined check passes when one of the two is missing, and the
      # ONE-SIDED case is the one that actually breaks here: a migration added to
      # the host set and forgotten in the tenant set produces an office database
      # missing a table, which surfaces as a runtime exception in front of a
      # user. That has shipped before. Two steps means two exit codes, two check
      # lines in the log, and a message naming the right folder -- a generic
      # failure sends people to the wrong migration set.
      #
      # `--no-build --configuration Release` (2026-09-24) reads the Release build two
      # steps above instead of compiling the project again in Debug. The long
      # `--configuration` is required: in dotnet-ef, `-c` is --context. Until then
      # this comment called --no-build an unproven variant, so it was proven before
      # being adopted, on this exact command form (dotnet-ef 10.0.7), per context:
      #   - clean tree: exit 0, "No changes have been made to the model";
      #   - a throwaway property on an entity mapped in BOTH contexts, rebuilt:
      #     exit 1, "Changes have been made to the model", for host AND tenant, and
      #     the regeneration probe below reported snapshot drift;
      #   - the same property WITHOUT rebuilding: exit 0. That control shows the
      #     check reads the build output rather than compiling, which is why it must
      #     stay AFTER the Release build in this job.
      # A NOTE ON EXIT 1, which is why these steps are not a bare `if`.
      #
      # `has-pending-model-changes` exits 1 for a pending model change AND for
      # any tooling failure -- a broken build, a context it cannot find, a
      # design-time factory that throws. Treating every exit 1 as "you forgot a
      # migration" would print a confident, specific, wrong diagnosis and send
      # someone to write a migration that was never missing.
      #
      # So the output is inspected as well as the exit code. Both outcomes still
      # FAIL: the distinction changes only the message, never the verdict, so a
      # wrong guess about the marker string cannot manufacture a false pass.
      - name: "Migrations: host schema is current"
        run: |
          # `set +e` FIRST, and the gate is worthless without it. GitHub invokes
          # this step as `bash -e {0}`, and `set -uo pipefail` does NOT clear
          # that -e. An assignment from a command substitution takes the
          # substitution's exit status, so under -e the shell dies the instant
          # `dotnet ef` exits 1 -- which is the ONE case this whole step exists
          # to detect. The step would still go red, so it would look correct,
          # while every line below became unreachable: no `migrations add`
          # command, no folder name, no distinction from a tooling failure.
          # Caught in CI on the run-B probe, which failed this exact way.
          set +e
          set -uo pipefail
          P=src/HealthcareSupport.CaseEvaluation.EntityFrameworkCore
          out=$(dotnet ef migrations has-pending-model-changes -c CaseEvaluationDbContext -p "$P" --no-build --configuration Release 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            echo "Host schema matches its migrations."
            exit 0
          fi
          # Case-SENSITIVE, and that is the whole point. EF's two messages are
          # "Changes have been made to the model since the last migration." and
          # "No changes have been made to the model since the last migration."
          # -- verified against Microsoft.EntityFrameworkCore.Design.dll 10.0.0,
          # the version this repo references. A case-insensitive match treats
          # those opposites as identical. It is unreachable today because the
          # success message comes with exit 0 and this branch only runs on a
          # non-zero exit, but a matcher that cannot tell "changed" from "not
          # changed" is one refactor away from being wrong.
          if printf '%s' "$out" | grep -q "Changes have been made to the model"; then
            m="The HOST model has changes with no migration in Migrations/."
            m="$m Add one with: dotnet ef migrations add <Name>"
            m="$m -c CaseEvaluationDbContext -o Migrations -p $P"
          else
            m="The host migration check could not complete (exit $rc) and this is"
            m="$m NOT a missing-migration report. Read the output above before"
            m="$m adding any migration."
          fi
          echo "::error::$m"
          exit 1

      - name: "Migrations: tenant schema is current"
        # Runs even when the host step failed. These are two independent
        # schemas, and the ONE-SIDED case is the whole reason this item exists;
        # letting the host failure short-circuit the tenant check would hide
        # exactly half of what the gate is for.
        if: always()
        run: |
          # See the note on the host step. `set +e` is required here for the same
          # reason, and it matters more: the tenant check is the one that catches
          # the one-sided case, so losing its message loses the item's point.
          set +e
          set -uo pipefail
          P=src/HealthcareSupport.CaseEvaluation.EntityFrameworkCore
          out=$(dotnet ef migrations has-pending-model-changes -c CaseEvaluationTenantDbContext -p "$P" --no-build --configuration Release 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            echo "Tenant schema matches its migrations."
            exit 0
          fi
          # Case-SENSITIVE, and that is the whole point. EF's two messages are
          # "Changes have been made to the model since the last migration." and
          # "No changes have been made to the model since the last migration."
          # -- verified against Microsoft.EntityFrameworkCore.Design.dll 10.0.0,
          # the version this repo references. A case-insensitive match treats
          # those opposites as identical. It is unreachable today because the
          # success message comes with exit 0 and this branch only runs on a
          # non-zero exit, but a matcher that cannot tell "changed" from "not
          # changed" is one refactor away from being wrong.
          if printf '%s' "$out" | grep -q "Changes have been made to the model"; then
            m="The TENANT model has changes with no migration in TenantMigrations/."
            m="$m Every office has its own database, so a missing tenant migration"
            m="$m is a runtime failure in front of a user, not a build problem."
            m="$m Add one with: dotnet ef migrations add <Name>"
            m="$m -c CaseEvaluationTenantDbContext -o TenantMigrations -p $P"
          else
            m="The tenant migration check could not complete (exit $rc) and this"
            m="$m is NOT a missing-migration report. Read the output above before"
            m="$m adding any migration."
          fi
          echo "::error::$m"
          exit 1

      # The two steps below are ADDITIONS to the has-pending-model-changes gate
      # above, not replacements. That gate is correct for what it checks and
      # must not be weakened: it compares the RELATIONAL model, and both of the
      # classes below are invisible to it for sound reasons (#912).
      - name: "Migrations: newest Designer matches the snapshot"
        # always(), same reasoning as the tenant step: independent checks, and a
        # one-sided failure is exactly the case worth seeing.
        if: always()
        run: |
          # `dotnet ef migrations remove` does not recompute the snapshot from
          # the model. Per Microsoft's documentation it "restores the model
          # represented by the preceding migration's designer metadata". So the
          # NEWEST Designer is the only one whose staleness can corrupt the
          # snapshot; older ones are inert unless you remove back past them.
          #
          # A branch cut before another migration merges generates a Designer
          # recording a model that predates it. Merging both leaves a tip
          # Designer disagreeing with the snapshot beside it, and a later
          # `remove` silently rolls the model back to it.
          #
          # Live instance (#911): #913's migrations were generated at 20:46:32Z,
          # 47 minutes before #906 merged, so both tip Designers lost
          # IX_AppDoctorAvailabilities_Slot_Identity -- a unique filtered index
          # -- while every gate above stayed correctly green.
          #
          # Costs no EF invocation and no design-time build: this compares two
          # files that are already in the tree.
          set +e
          set -uo pipefail
          P=src/HealthcareSupport.CaseEvaluation.EntityFrameworkCore
          rc_total=0
          extract() {
            # The model body only: the Build{TargetModel,Model} signature differs
            # between a Designer and a snapshot by design, so drop it and compare
            # what follows.
            sed -n '/protected override void Build\(TargetModel\|Model\)/,$p' "$1" \
              | tail -n +2 | sed 's/[[:space:]]*$//'
          }
          check() {
            dir="$1"; snap="$2"; label="$3"
            snap_path="$P/$dir/$snap"
            if [ ! -f "$snap_path" ]; then
              echo "::error::$label: snapshot not found at $snap_path. This check could not run and is NOT reporting drift."
              return 2
            fi
            # EF prefixes migration files with a sortable UTC timestamp, so the
            # last lexical entry is the newest migration.
            newest=$(find "$P/$dir" -maxdepth 1 -name '*.Designer.cs' | sort | tail -1)
            if [ -z "$newest" ]; then
              echo "::error::$label: no .Designer.cs under $P/$dir. This check could not run and is NOT reporting drift."
              return 2
            fi
            d=$(extract "$newest")
            s=$(extract "$snap_path")
            # An empty extraction means the generated layout changed. Failing
            # loudly beats comparing two empty strings and reporting a match.
            if [ -z "$d" ] || [ -z "$s" ]; then
              echo "::error::$label: extracted an empty model body from $(basename "$newest") or the snapshot. The generated file layout changed and this check needs updating."
              return 2
            fi
            if [ "$d" = "$s" ]; then
              echo "$label: $(basename "$newest") matches the snapshot."
              return 0
            fi
            echo "::group::$label -- in the snapshot, missing from the newest Designer"
            diff <(printf '%s\n' "$d") <(printf '%s\n' "$s") | grep '^>'
            echo "::endgroup::"
            m="$label: the newest migration's Designer does not match the model"
            m="$m snapshot, so 'dotnet ef migrations remove' here would rewrite the"
            m="$m snapshot to that stale model and drop whatever is listed above."
            m="$m This usually means a branch was cut before another migration"
            m="$m merged. Fix by APPENDING an empty migration so the tip Designer"
            m="$m regenerates -- do not hand-edit a Designer, and do not use"
            m="$m 'migrations remove': dotnet ef migrations add <Name> -c <Context>"
            m="$m -o $dir -p $P"
            echo "::error::$m"
            return 1
          }
          check Migrations       CaseEvaluationDbContextModelSnapshot.cs       "HOST"
          rc=$?
          [ "$rc" -gt "$rc_total" ] && rc_total=$rc
          check TenantMigrations CaseEvaluationTenantDbContextModelSnapshot.cs "TENANT"
          rc=$?
          [ "$rc" -gt "$rc_total" ] && rc_total=$rc
          exit "$rc_total"

      - name: "Migrations: snapshot matches a fresh regeneration"
        if: always()
        run: |
          # has-pending-model-changes compares the RELATIONAL model. A
          # HasColumnName equal to the property's own name produces a
          # byte-identical relational model, so the differ finds nothing and the
          # gate passes -- correctly. The snapshot TEXT can therefore diverge
          # from what a regeneration would produce, indefinitely.
          #
          # That is not hypothetical: the tenant snapshot was missing
          # HasColumnName("AfterValues") and its BeforeValues sibling from
          # 2026-08-21 to 2026-09-15. Every PR in that window ran the gate above
          # and passed. The drift finally landed as unexplained diff noise in
          # #906, an unrelated index PR (#912).
          #
          # Method: scaffold a throwaway migration, which makes EF rewrite the
          # snapshot from the current model, then assert the snapshot did not
          # move.
          #
          # TEARDOWN IS `rm` PLUS A RESTORE FROM A COPY, NEVER `migrations
          # remove`. `remove` restores the snapshot from the preceding
          # migration's designer metadata rather than recomputing it, so using it
          # here would reinstate whatever drift that Designer carries -- the bug
          # checking for itself. See the step above and #911.
          set +e
          set -uo pipefail
          P=src/HealthcareSupport.CaseEvaluation.EntityFrameworkCore
          PROBE=ZZDriftProbe
          WORK="${RUNNER_TEMP:-/tmp}/driftprobe.$$"
          mkdir -p "$WORK"
          rc_total=0
          probe() {
            ctx="$1"; dir="$2"; snap="$3"; label="$4"
            snap_path="$P/$dir/$snap"
            if [ ! -f "$snap_path" ]; then
              echo "::error::$label: snapshot not found at $snap_path. This check could not run and is NOT reporting drift."
              return 2
            fi
            cp "$snap_path" "$WORK/$snap.orig"
            out=$(dotnet ef migrations add "$PROBE" -c "$ctx" -o "$dir" -p "$P" --no-build --configuration Release 2>&1)
            add_rc=$?
            if [ "$add_rc" -ne 0 ]; then
              printf '%s\n' "$out"
              echo "::error::$label: could not scaffold the probe migration (exit $add_rc). This is NOT a drift report -- read the output above."
              return 2
            fi
            # --text because .gitattributes marks both migration trees `-diff`;
            # without it git calls these files binary and reports no changes at
            # all, which would read as a clean pass.
            diff_out=$(git diff --text -- "$snap_path")
            find "$P/$dir" -maxdepth 1 -name "*_${PROBE}.cs" -delete
            find "$P/$dir" -maxdepth 1 -name "*_${PROBE}.Designer.cs" -delete
            cp "$WORK/$snap.orig" "$snap_path"
            if [ -n "$diff_out" ]; then
              echo "::group::$label snapshot drift"
              printf '%s\n' "$diff_out"
              echo "::endgroup::"
              m="$label: the committed model snapshot is not what a regeneration"
              m="$m would produce. The relational model is unchanged, which is why"
              m="$m has-pending-model-changes passes. Left alone this surfaces later"
              m="$m as unrelated diff noise in whichever PR next adds a migration."
              m="$m Regenerate with: dotnet ef migrations add <Name> -c $ctx"
              m="$m -o $dir -p $P"
              echo "::error::$m"
              return 1
            fi
            echo "$label: snapshot matches a fresh regeneration."
            return 0
          }
          probe CaseEvaluationDbContext       Migrations       CaseEvaluationDbContextModelSnapshot.cs       "HOST"
          rc=$?
          [ "$rc" -gt "$rc_total" ] && rc_total=$rc
          probe CaseEvaluationTenantDbContext TenantMigrations CaseEvaluationTenantDbContextModelSnapshot.cs "TENANT"
          rc=$?
          [ "$rc" -gt "$rc_total" ] && rc_total=$rc
          # Leave nothing behind whatever happened above.
          find "$P/Migrations" "$P/TenantMigrations" -maxdepth 1 -name "*_${PROBE}*" -delete 2>/dev/null
          rm -rf "$WORK"
          exit "$rc_total"

  docs-structure:
    name: "Docs: Structure Check"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.x"
      - name: Verify documentation structure
        run: python .claude/scripts/verify_structure.py
      - name: Check documentation links
        run: python .claude/scripts/check-links.py || true
        # Link check is non-blocking: pre-existing broken links (tracked in
        # docs/verification/BASELINE.md) should not fail CI. The job still
        # prints the full report for visibility.

  packet-golden:
    name: "Tools: Packet Golden Output"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # DELIBERATELY UNCONDITIONAL (#797). Two reasons.
    #
    # `tools/` is not one of the classifier's recognised groups, so it lands in
    # `unclassified` and currently makes the FULL suite run. Adding a `tools`
    # arm to classify it would remove that safety net, which is a bigger change
    # than this job warrants -- so this job simply does not depend on the
    # classifier at all.
    #
    # And a conditional job that skips reports Success. The comment on the
    # `changes` job above exists because that behaviour once let a pull request
    # satisfy every required check having run none of them. This check costs
    # about two seconds and needs nothing but Python, so there is no reason to
    # buy that risk back.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.x"
      - name: Verify the packet generators emit byte-identical documents
        run: python -m unittest discover -s tools/packet-templates/tests -p "test_*.py" -v

  python-test:
    name: "Python: Test"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # DELIBERATELY UNCONDITIONAL, for the reason #821 gives on `packet-golden`.
    #
    # A conditional job that skips reports Success and blocks nothing. The
    # comment on the `changes` job records what that once cost. This job takes
    # seconds and depends on nothing but Python, so it does not depend on the
    # classifier at all -- there is no `needs:` and no `if:` to get wrong.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.x"

      # The ONLY third-party dependency, and it is the deliverable rather than
      # the runner: this job exists to produce a coverage report. The tests
      # themselves are stdlib `unittest` and need nothing installed.
      #
      # Pinned exactly, following the precedent already set in this file for
      # dotnet-coverage 18.11.0: a pin locks in the toolchain that produced the
      # verified figure rather than whatever the index serves next.
      #
      # NOT hash-pinned, and that is item 2.14's decision rather than an oversight
      # (#700). Scorecard's PinnedDependenciesID wants --require-hashes against a
      # requirements file carrying a hash for every transitive dependency. Declined
      # for the same reason docker/packet-renderer/Dockerfile records: PyPI does not
      # permit a published version to be re-uploaded with different content, so the
      # residual risk a hash closes is a registry compromise, against which the cost
      # is a lock file regenerated in full on every bump. The reason is repeated here
      # because this is where a reader lands, not that Dockerfile.
      #
      # `--only-binary :all:` is ORTHOGONAL to that decision, and is what B9 adds here
      # (2026-09-25) instead of hashes. It refuses source distributions, so no sdist
      # `setup.py` runs during install -- which is the arbitrary-code-execution surface a
      # version pin alone leaves open. #700 argues about REGISTRY compromise and says
      # nothing against this, so both positions stand together and #700 is unchanged.
      #
      # It fails CLOSED: with no wheel for the runner platform the step errors rather than
      # quietly building from source. Verified against the PyPI API before merging --
      # coverage 7.15.2 ships 90 wheels including manylinux x86_64 for cp310 to cp314.
      #
      # THE VALUE IS QUOTED, and it has to be. `:all: coverage` contains a colon followed
      # by a space, which YAML reads as a mapping key, so the unquoted form makes this file
      # fail to parse entirely. Caught by a parser, not by review.
      #
      # ONE COUPLING THIS CREATES, recorded because it will outlive whoever reads it next:
      # `python-version` in this job is "3.x", i.e. whatever the runner's newest stable
      # Python is. Wheels exist for cp310-cp314 today. When the runner moves to a Python
      # with no coverage 7.15.2 wheel, this step FAILS rather than silently building from
      # source -- which is the intended behaviour, but the fix then is to bump coverage,
      # not to drop this flag.
      - name: Install coverage
        run: "python -m pip install --only-binary :all: coverage==7.15.2"

      # Configuration lives in pyproject.toml, deliberately, rather than on this
      # command line -- so a local run and CI cannot disagree about `source`,
      # which is the setting that decides whether the emitted paths are
      # repo-relative or silently stripped.
      #
      # `test -s coverage.xml` asserts on the ARTEFACT the command should have
      # produced, rather than trusting the exit code of the command meant to
      # produce it.
      # #787: the command moved into scripts/python-coverage.sh so this job and
      # the SonarCloud analysis cannot drift in flags, exclusions or working directory --
      # the failure mode `.coverage-exclusions` already suffered once. The
      # artefact-not-exit-code assertion moved with it. (Since #1032 the SonarCloud
      # job reuses this job's `python-coverage` artifact instead of re-running it.)
      - name: Test with coverage
        run: bash scripts/python-coverage.sh coverage.xml

      # DELIBERATELY DOES NOT INVOKE scripts/coverage-gate.py.
      #
      # `measure_all()` labels stacks only "backend" (Cobertura) and "frontend"
      # (lcov); there is no Python label and no --floor-python. Routing this
      # report through --cobertura would print `backend: NN%` for a PYTHON
      # figure in the log, and would pool Python into the changed-lines map. The
      # gate learns about Python in step 4 (#787), which is also where
      # FLOOR_PYTHON is set -- from a real observed number, never a guessed one.

      # if: always() is load-bearing, exactly as on backend-test's upload. A
      # later consumer must be able to tell "the job failed" apart from "the
      # report is absent"; uploading only on success collapses those into one
      # indistinguishable state.
      - name: Upload python coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: python-coverage
          path: coverage.xml
          retention-days: 14

  # #1032: the backend tests run as 4 parallel shards plus an aggregate job. The EF Core
  # integration assembly took 21-23 min run one test at a time (about 1.34 s each, every test
  # building its own ABP application), which made Backend: Test the longest check on every PR.
  #
  # scripts/shard-tests.py assigns whole test CLASSES to shards (greedy on test count, the same
  # answer for the same classes), and each shard then VERIFIES from its .trx results that it ran
  # exactly the classes it was given -- a class no shard's filter matches would otherwise never
  # run and report nothing. Shard 1 also runs every other *.Tests project whole (seconds), so a
  # new test project is picked up without editing this file.
  #
  # Each shard collects `.coverage` (the lossless binary format); the aggregate merges them once
  # into Cobertura for Coverage: Floors and into the XML SonarCloud reads.
  backend-test-shard:
    name: "Backend: Test (shard ${{ matrix.shard }}/4)"
    runs-on: ubuntu-latest
    # NOT gated on backend-build (2026-09-24). Each shard restores and builds for itself below,
    # so waiting for that job only delayed the suite by the length of the build (3 m 18 s on run
    # 36029959278). What the build gates is unchanged: the aggregate `backend-test` below still
    # needs backend-build to have SUCCEEDED, so after a build or migration-check failure it is
    # skipped exactly as before, whatever the shards did. The `if:` is backend-build's own
    # path condition, copied --
    # KEEP THE TWO IDENTICAL, or the shards and the build disagree about when the backend runs.
    needs: changes
    if: >-
      ${{ always() && (needs.changes.result != 'success'
      || needs.changes.outputs.backend == 'true'
      || needs.changes.outputs.shared == 'true'
      || needs.changes.outputs.unclassified == 'true') }}
    # A shard runs about a quarter of the suite (5-6 min) plus setup. #1029's 45 covered the
    # whole suite in one job; 30 leaves room for the suite to grow and still cuts off a hang.
    timeout-minutes: 30
    strategy:
      # One failing shard must not cancel the others: their results still say which tests pass.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARDS: "4"
      EF_TESTS: test/HealthcareSupport.CaseEvaluation.EntityFrameworkCore.Tests/HealthcareSupport.CaseEvaluation.EntityFrameworkCore.Tests.csproj
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/common.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Generate NuGet.Config
        run: sed "s/\${ABP_NUGET_API_KEY}/${{ secrets.ABP_NUGET_API_KEY }}/" NuGet.Config.template > NuGet.Config
      - name: Create placeholder secrets files
        run: |
          for dir in src/HealthcareSupport.CaseEvaluation.AuthServer \
                     src/HealthcareSupport.CaseEvaluation.HttpApi.Host \
                     src/HealthcareSupport.CaseEvaluation.DbMigrator \
                     test/HealthcareSupport.CaseEvaluation.TestBase \
                     test/HealthcareSupport.CaseEvaluation.HttpApi.Client.ConsoleTestApp; do
            if [ -n "${{ secrets.ABP_LICENSE_CODE }}" ]; then
              echo "{\"AbpLicenseCode\": \"${{ secrets.ABP_LICENSE_CODE }}\"}" > "$dir/appsettings.secrets.json"
            else
              echo '{}' > "$dir/appsettings.secrets.json"
            fi
          done
      - run: dotnet restore HealthcareSupport.CaseEvaluation.slnx --locked-mode
      - run: dotnet build HealthcareSupport.CaseEvaluation.slnx --no-restore -c Release
      # PINNED to the version that produced the coverage gate's verified figures (see the
      # 2026-09-03 note this replaced: 18.11.0 measured 73.61% over 887 files).
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage --version 18.11.0
      - name: Choose this shard's test classes
        run: |
          set -euo pipefail
          dotnet test "$EF_TESTS" --no-build -c Release --list-tests > ef-tests.txt
          # --sources: classes in a shared-database collection (MultiOffice, RealAuthorization)
          # are read from their [Collection] attributes and kept together in one shard.
          python3 scripts/shard-tests.py partition --listing ef-tests.txt \
            --sources "$(dirname "$EF_TESTS")" \
            --shards "$SHARDS" --index "${{ matrix.shard }}" \
            --classes-out shard-classes.txt --runsettings-out shard.runsettings
      # The filter travels in shard.runsettings, not on the command line: the command runs
      # inside dotnet-coverage's single command string, and dozens of `|` terms are fragile
      # through that second layer of quoting.
      #
      # -s dotnet-coverage.settings.xml (both collect steps): instrument ONLY our own
      # HealthcareSupport.CaseEvaluation.* assemblies, so a dependency's SourceLinked source is
      # never graded as ours. The reason and the known limit are in that file.
      - name: Test (EF Core, this shard)
        run: >
          dotnet-coverage collect
          -s dotnet-coverage.settings.xml
          'dotnet test ${{ env.EF_TESTS }} --no-build -c Release
          --settings shard.runsettings
          --logger trx
          --results-directory ./test-results/ef'
          -f coverage -o coverage-ef-${{ matrix.shard }}.coverage
      - name: Test (every other test project, whole)
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          mapfile -t projects < <(python3 scripts/shard-tests.py other-projects \
            --slnx HealthcareSupport.CaseEvaluation.slnx --sharded "$EF_TESTS")
          [ "${#projects[@]}" -gt 0 ] || { echo "::error::no other test projects found"; exit 1; }
          i=0
          for project in "${projects[@]}"; do
            i=$((i + 1))
            echo "::group::$project"
            dotnet-coverage collect \
              -s dotnet-coverage.settings.xml \
              "dotnet test $project --no-build -c Release --logger trx --results-directory ./test-results/other" \
              -f coverage -o "coverage-other-$i.coverage"
            echo "::endgroup::"
          done
      - name: Verify this shard ran exactly its classes
        run: python3 scripts/shard-tests.py verify --classes shard-classes.txt --trx-dir ./test-results/ef
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: backend-test-results-${{ matrix.shard }}
          path: |
            ./test-results
            shard-classes.txt
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: backend-shard-coverage-${{ matrix.shard }}
          path: coverage-*.coverage
          if-no-files-found: error
          retention-days: 14

  # Keeps the name `Backend: Test`, a required check on main, and the contract Coverage: Floors
  # reads: artifact `backend-coverage` holding `coverage.cobertura.xml`, plus this job's result.
  backend-test:
    name: "Backend: Test"
    runs-on: ubuntu-latest
    needs: [backend-build, backend-test-shard]
    if: ${{ always() && needs.backend-build.result == 'success' }}
    timeout-minutes: 10
    steps:
      - name: Require every shard to have passed
        run: |
          result='${{ needs.backend-test-shard.result }}'
          if [ "$result" != "success" ]; then
            echo "::error::The backend test shards reported '$result'. Every shard must pass."
            exit 1
          fi
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage --version 18.11.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: backend-shard-coverage-*
          path: shards
      # Every shard must have delivered its EF Core coverage, or the merged figure would be a
      # silent under-count rather than an error.
      - name: Merge the shards' coverage
        run: |
          set -euo pipefail
          for k in 1 2 3 4; do
            [ -s "shards/backend-shard-coverage-$k/coverage-ef-$k.coverage" ] || {
              echo "::error::shard $k delivered no EF Core coverage file"; exit 1; }
          done
          mapfile -t files < <(find shards -name '*.coverage' | sort)
          printf 'merging %s\n' "${files[@]}"
          dotnet-coverage merge "${files[@]}" -f cobertura -o coverage.cobertura.xml
          dotnet-coverage merge "${files[@]}" -f xml -o coverage.xml
          test -s coverage.cobertura.xml
          test -s coverage.xml
      - name: Upload backend coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: backend-coverage
          path: coverage.cobertura.xml
          retention-days: 14
      - name: Upload backend coverage for SonarCloud
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: backend-coverage-xml
          path: coverage.xml
          retention-days: 14

  frontend-build:
    name: "Frontend: Build"
    runs-on: ubuntu-latest
    needs: changes
    # always(): see the note on backend-build.
    if: >-
      ${{ always() && (needs.changes.result != 'success'
      || needs.changes.outputs.frontend == 'true'
      || needs.changes.outputs.shared == 'true'
      || needs.changes.outputs.unclassified == 'true') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: angular/yarn.lock
      # Yarn 4 (Berry) is pinned via package.json packageManager; corepack
      # activates it (must run after setup-node, before any yarn command).
      - run: corepack enable
      - run: yarn install
      - run: yarn build:prod

  frontend-lint:
    name: "Frontend: Lint"
    runs-on: ubuntu-latest
    needs: changes
    # always(): see the note on backend-build.
    if: >-
      ${{ always() && (needs.changes.result != 'success'
      || needs.changes.outputs.frontend == 'true'
      || needs.changes.outputs.shared == 'true'
      || needs.changes.outputs.unclassified == 'true') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: angular/yarn.lock
      # Yarn 4 (Berry) is pinned via package.json packageManager; corepack
      # activates it (must run after setup-node, before any yarn command).
      - run: corepack enable
      - run: yarn install
      - run: yarn lint

  frontend-test:
    name: "Frontend: Test"
    runs-on: ubuntu-latest
    needs: [changes, frontend-build]
    # See the note on backend-test.
    if: ${{ always() && needs.frontend-build.result == 'success' }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: angular/yarn.lock
      # Yarn 4 (Berry) is pinned via package.json packageManager; corepack
      # activates it (must run after setup-node, before any yarn command).
      - run: corepack enable
      - run: yarn install
      - name: Check for test files
        id: check-tests
        # Phase A/B behavior: emit a ::warning annotation when no *.spec.ts
        # files exist (visible in PR UI, not a red ✗). The test step below
        # is gated on has_tests so we skip rather than run yarn test with
        # nothing to execute. Once Phase B #8 adds specs for the 13
        # untested entities, this branch stops firing and the job is a
        # normal green test run.
        #
        # Phase C hardens this: revert to ::error + exit 1 in the else
        # branch, and drop the if-guard on "Run tests with coverage" so
        # the job fails hard if specs are ever removed.
        run: |
          if find src -name "*.spec.ts" | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "Found spec files; proceeding with tests." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No *.spec.ts files found under angular/src. Phase A/B: informational; Phase C will require specs."
          fi
      - name: Run tests with coverage
        if: steps.check-tests.outputs.has_tests == 'true'
        run: yarn test --watch=false --browsers=ChromeHeadless --code-coverage
      # Item 2.10. `path` is repo-relative on purpose: defaults.run.working-directory
      # applies to `run` steps only, never to `uses` steps, so `coverage/**` here
      # would resolve against the workspace root and silently upload nothing.
      #
      # if: always() for the reason given in backend-test, plus one specific to
      # this job: the coverage step above is gated on has_tests, so if the specs
      # ever disappear it is SKIPPED while the job still reports success and no
      # lcov is written. That is a check reporting success without having run.
      # Uploading unconditionally is what lets the gate see the absence and fail
      # on it rather than inherit the false green.
      - name: Upload frontend coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: frontend-coverage
          path: angular/coverage/**/lcov.info
          retention-days: 14

  backend-format:
    name: "Backend: Format Check"
    runs-on: ubuntu-latest
    needs: changes
    # always(): the classifier's OWN failure must not skip this job. If it
    # cannot classify, run -- the same deny-by-default rule as `unclassified`.
    if: >-
      ${{ always() && (needs.changes.result != 'success'
      || needs.changes.outputs.backend == 'true'
      || needs.changes.outputs.shared == 'true'
      || needs.changes.outputs.unclassified == 'true') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # #617: the Pacific-date bug class, guarded where BannedSymbols cannot reach.
      #
      # src/BannedSymbols.txt bans DateTime.Today and DateTime.Now, and says why it
      # does NOT ban DateTime.UtcNow -- that yields a correct INSTANT and is the right
      # call for storage. It then names the hole it leaves:
      #
      #   "DateTime.UtcNow.Date is the same bug; do not substitute it."
      #
      # BannedApiAnalyzers bans SYMBOLS, not expressions, so it cannot express
      # "UtcNow is fine but .Date on it is not". Nor can it reach _clock.Now.Date,
      # which is the same defect wearing the approved API -- that one reached
      # production and accepted a future injury date for 7-8 hours of every Pacific
      # working day (#623).
      #
      # Placed before restore so it costs seconds and fails fast. Comment lines are
      # excluded so the rule can be DESCRIBED in prose without tripping itself.
      #
      # COVERS test/ AS WELL AS src/ (#624). The analyser half of this guard cannot:
      # src/Directory.Build.props scopes src/BannedSymbols.txt to shipping code
      # deliberately, so test projects may build fixtures from concrete DateTime values,
      # which is what a test should do. `DateTime.UtcNow.Date` is not that. It is not a
      # concrete value at all -- it is whatever UTC calendar date the suite happens to run
      # on, so the fixture differs every day and the pattern sits in the files people copy
      # from. Three sites existed in test/ when this was extended; all three were replaced
      # with fixed dates, which is how the rest of the suite already builds appointments.
      #
      # This does NOT extend the DateTime.Today / DateTime.Now ban to test/. That is 69
      # sites and a decision about what a fixture may be, recorded on #624 rather than
      # taken here.
      - name: No UTC calendar dates
        run: |
          hits=$(grep -rn --include='*.cs' -E '(DateTime\.UtcNow|[Cc]lock\.Now)\.Date' src/ test/ \
                 | grep -vE ':[[:space:]]*(//|///|\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            m='a UTC instant had .Date taken off it. On a UTC server that is TOMORROW'
            m="$m's Pacific date after ~5pm, every day. Use PacificTime.TodayFrom(clock.Now)"
            m="$m -- or a fixed date in a test fixture. See src/BannedSymbols.txt and #623."
            echo "::error::$m"
            exit 1
          fi
          echo 'No UTC calendar dates in src/ or test/.'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/common.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Generate NuGet.Config
        run: sed "s/\${ABP_NUGET_API_KEY}/${{ secrets.ABP_NUGET_API_KEY }}/" NuGet.Config.template > NuGet.Config
      - name: Create placeholder secrets files
        run: |
          for dir in src/HealthcareSupport.CaseEvaluation.AuthServer \
                     src/HealthcareSupport.CaseEvaluation.HttpApi.Host \
                     src/HealthcareSupport.CaseEvaluation.DbMigrator \
                     test/HealthcareSupport.CaseEvaluation.TestBase \
                     test/HealthcareSupport.CaseEvaluation.HttpApi.Client.ConsoleTestApp; do
            if [ -n "${{ secrets.ABP_LICENSE_CODE }}" ]; then
              echo "{\"AbpLicenseCode\": \"${{ secrets.ABP_LICENSE_CODE }}\"}" > "$dir/appsettings.secrets.json"
            else
              echo '{}' > "$dir/appsettings.secrets.json"
            fi
          done
      - run: dotnet restore HealthcareSupport.CaseEvaluation.slnx --locked-mode
      - run: dotnet format HealthcareSupport.CaseEvaluation.slnx --no-restore --verify-no-changes --verbosity diagnostic

  frontend-format:
    name: "Frontend: Format Check"
    runs-on: ubuntu-latest
    needs: changes
    # always(): see the note on backend-build.
    if: >-
      ${{ always() && (needs.changes.result != 'success'
      || needs.changes.outputs.frontend == 'true'
      || needs.changes.outputs.shared == 'true'
      || needs.changes.outputs.unclassified == 'true') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: angular/yarn.lock
      # Yarn 4 (Berry) is pinned via package.json packageManager; corepack
      # activates it (must run after setup-node, before any yarn command).
      - run: corepack enable
      - run: yarn install
      - run: yarn format:check

  coverage-floors:
    name: "Coverage: Floors"
    runs-on: ubuntu-latest
    needs: [changes, backend-test, frontend-test, python-test]
    # `if: always()` with NO further condition, and that is the whole point of
    # this job. Every other job in this file is conditional, and a SKIPPED job
    # reports "Success" and does not block a merge even when it is a required
    # check (catalogue instance 12). A coverage gate that inherits that
    # conditionality passes by not running, which is the single defect item 2.10
    # exists to prevent. So this job always runs and decides applicability
    # itself, below, where absent input is a hard failure rather than an absent
    # constraint.
    if: always()
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Absolute per-stack line coverage floors, measured through the shared
      # .coverage-exclusions list that the sonarcloud job also consumes. One list,
      # two readers: two lists drift, and a drift means two gates disagree with
      # nobody able to say which is right.
      #
      # ============================================================
      # WHOLE NUMBERS ONLY. Adrian's rule, 2026-09-03. DO NOT "TIGHTEN"
      # THESE BACK TO FRACTIONAL VALUES -- that reintroduces a real defect.
      # ============================================================
      #
      # What the fractional version cost us. The gate prints a figure ROUNDED to
      # two places; the comparison uses the unrounded value. Two runs of the SAME
      # code measured:
      #
      #   33197/45098 = 73.6108%   both print as "73.61%"
      #   33195/45098 = 73.6064%
      #
      # A floor of 73.61 -- the printed figure, and the obvious thing to copy in
      # -- PASSES the first and FAILS the second. Two lines of ordinary test
      # nondeterminism is 0.0044 points, so any floor set from the display sits
      # inside the display's own rounding error and the gate goes red on
      # unchanged code. It would be blamed on the gate, not on the rounding.
      #
      # A whole number cannot be tripped by that: it removes the failure mode
      # rather than managing it with a hand-picked margin.
      #
      # THE COST, stated so it is not discovered later:
      #
      #   backend   measured 73.6064%   floor 73   slack 0.61 pts  ~273 lines
      #   frontend  measured 20.97%     floor 20   slack 0.97 pts   ~88 lines
      #
      # ~273 backend lines could go uncovered before the absolute floor fires.
      # That is real, and it is acceptable for one reason: THE ABSOLUTE FLOORS
      # ARE NOT THE SENSITIVE CONTROL. FLOOR_CHANGED below is 80% on the lines
      # each submission touches, and it catches new uncovered code per pull
      # request, long before it could accumulate into a 273-line drift. The
      # absolute floors are a backstop against slow erosion.
      #
      # FRONTEND -- measured, never guessed:
      #   scripts/coverage-gate.py --measure-only \
      #     --lcov angular/coverage/CaseEvaluation/lcov.info --lcov-prefix angular
      #   -> frontend: 20.97% (1900/9062 lines over 269 files)
      #
      # 69 UNTIL 2026-09-04, AND THAT FIGURE WAS NOT A HIGHER STANDARD -- it was
      # a smaller sample. It described 82 files because karma only instruments
      # what a spec reaches, so 184 of the 269 application sources were
      # invisible to coverage rather than uncovered by it. Item 2.13 widened the
      # karma target's `include` and tsconfig.spec.json so every source is
      # instrumented; the same tests, all 667 still passing, then measure 20.97%
      # over the whole application.
      #
      # So this is not a regression and must not be read as one. The covered
      # line count went UP (1713 -> 1900): karma executes a file's top-level
      # code when it loads it as an entry point, so imports and declarations in
      # the newly visible files register as hit. The denominator is what
      # actually changed, from a third of the app to all of it.
      #
      # Trustworthy for the same reason the old figure was: the UNFILTERED read
      # of that same report reproduces karma's own summary exactly (20.73%,
      # 2049/9881), which validates the parser rather than merely the number.
      #
      # 20 UNTIL 2026-09-21, AND IT COULD NOT FIRE. Phase-8 tranches 1-9 took the front end from
      # 20.97% to 80.14% and the floor never followed, so four fifths of the frontend suite could
      # have been deleted without tripping it. Issue #979 carried the trigger -- raise it once the
      # epic branch's coverage reached `main` -- and that happened 2026-09-19: #987 promoted the
      # epic at 00:11:29Z, #974 cascaded main to development at 00:20:55Z.
      #
      # MEASURED TWICE, IN TWO ENVIRONMENTS, because one instrument agreeing with itself is the
      # null result you would get either way:
      #
      #   CI, ubuntu runner. PR #984, whose base was the epic branch, run 35405349286:
      #     frontend: measured 80.14% (7307/9118 lines over 272 files)
      #
      #   LOCAL, Windows / Node 24 / Chrome Headless 153, at epic tip 5b1b0781:
      #     npx ng test --watch=false --browsers=ChromeHeadless --code-coverage
      #       -> Executed 3057 of 3057 SUCCESS / TOTAL: 3057 SUCCESS
      #     git ls-files > tracked.txt
      #     python scripts/coverage-gate.py --measure-only --exclusions .coverage-exclusions \
      #       --lcov angular/coverage/CaseEvaluation/lcov.info --lcov-prefix angular \
      #       --tracked-files tracked.txt
      #       -> frontend: 80.14% (7307/9118 lines over 272 files)
      #
      # Agreement was exact, including both line counts AND the file count. `main` measures
      # 80.19% (7319/9127) on run 35408497124. Pass --tracked-files a REAL FILE: a process
      # substitution hands a /dev/fd path to a Windows Python and resolves somewhere else.
      #
      # BEWARE WHICH RUN YOU READ. The most recent runs on the epic and on `main` are both
      # pull_request events, so Actions measured the MERGE COMMIT rather than either branch tip.
      # Both report 80.19% (7319/9127), which is post-cascade content and NOT the epic's tree --
      # the 9-line difference is #983. Read a run whose base was the branch you care about.
      #
      # 90 FROM 2026-09-24 (was 80), ADRIAN'S END STATE FOR THE TEST PUSH. READ THIS BEFORE
      # "CORRECTING" IT.
      #
      # Adrian set the end state of the phase-8 test-writing push: once the in-flight test pull
      # requests take the frontend to about 92-94%, this floor is 90 (and FLOOR_BACKEND is 85), and
      # test writing for the phase ends. THIS CHANGE MERGES LAST. The epic measured 85.50% frontend
      # when it was written, so until those pull requests merge 90 sits ABOVE the measurement and
      # fails; after they merge it is a backstop a few points below it. 90 is his figure, not the
      # truncate-down arithmetic.
      #
      # THE 80-FLOOR ARITHMETIC BELOW IS HISTORY, not a description of 90. These were all computed for
      # a floor of 80 against 80.14% and 80.19%:
      #   - the "80 IS THE CONVENTION FIGURE" paragraph;
      #   - the margin table (12 lines lost, 15 new lines at 0%);
      #   - the "0.138 available";
      #   - "1/12 OF THIS FLOOR'S MARGIN" and the "twelve-line budget".
      # Re-measure the margin in lines, in both directions, from the first Floors run after the test
      # pull requests merge, and replace them then. The measurement method and the #965 one-line
      # bound still hold.
      #
      # 80 IS THE CONVENTION FIGURE FROM :976-990 (truncate the measurement DOWN to a whole
      # number), and it is the TIGHT choice rather than the headroom one. FLOOR_PYTHON below
      # departs from that convention deliberately -- 90 against 92.05% -- on the PR review lane's
      # #971 argument that one production file added without tests can turn CI red on a submission
      # that did nothing wrong. Adrian ruled the other way here on 2026-09-21: take the ratchet,
      # because every change to this app should be intended and the app should be protected as
      # far as possible. #979's own text proposed 75 and computed "3.82 points of headroom";
      # BOTH figures were derived against the 78.82% the epic measured on 2026-09-18 and are now
      # stale twice over. Do not reintroduce either number.
      #
      # THE MARGIN, IN LINES, IN BOTH DIRECTIONS, because points hide how small it is. The
      # comparison uses the UNROUNDED value, per :976-987:
      #
      #                                        epic (7307/9118)   main (7319/9127)
      #     covered lines that may be LOST            12                 17
      #     NEW production lines at 0% coverage       15                 21
      #     one flipped line is worth              0.011 pts          0.011 pts
      #
      # THE 15 IS THE NUMBER TO WATCH, not the 12. One new component of ~40 lines merged without
      # a spec takes the epic under this floor while breaking nothing -- exactly the failure mode
      # #971 named, here with about a sixth of the slack that argument was about. FLOOR_CHANGED
      # at 80% already gates new code per submission, so if this floor starts producing false
      # reds it is the ABSOLUTE one to reconsider, never the changed-lines one.
      #
      # THE ROUNDING ARGUMENT AT :989 STILL HOLDS, and is not what makes this tight. One line is
      # 0.011 points and cannot reach the 0.138 available, so display rounding and ordinary
      # two-line jitter cannot trip a whole number here. The exposure is real code change.
      #
      # SAME-MACHINE VARIANCE IS ZERO. CROSS-ENVIRONMENT VARIANCE IS ONE LINE. Both measured.
      #
      # Two full local suites 26 minutes apart on identical code at 5b1b0781, compared line by
      # line with the gate's own MAX-hits semantics: 0 state flips, 0 hit-count changes across all
      # 9,118 counted lines, byte-identical per-file output. So a re-run on one machine does not
      # move this figure.
      #
      # THAT IS NOT THE SAME AS STABLE, and the difference showed up the same afternoon. The
      # local and CI reports for the SAME commit were diffed against each other, and across 9,118
      # lines there was exactly ONE state flip:
      #
      #   appointments/wizard/appointment-wizard.component.ts:190   local hit=2   CI hit=0
      #
      # That is #965's line, so this is no longer a historical observation about it -- it is the
      # measured behaviour, and the flip has now been seen between two CI runs of two of this
      # epic's own pull requests. ONE LINE IS 1/12 OF THIS FLOOR'S MARGIN. It does not break an 80
      # floor on its own, and it cannot cascade (see the bound below), but the drift is live rather
      # than retired, and it consumes margin in the environment where the floor is actually
      # enforced. If #965 is ever fixed, this floor gets that twelfth back.
      #
      # THE ONE KNOWN NONDETERMINISTIC LINE IS #965, AND ITS COST IS BOUNDED AT ONE LINE.
      # appointment-wizard.component.ts:190 is the arrow body of a debounceTime(600) subscription
      # that no spec drives deliberately, and karma.conf.js:14-20 leaves jasmine's random spec
      # ordering on. It was observed flipping between two runs whose spec SET differed -- which is
      # what every coverage tranche does, so expect it at a tranche boundary, not on a re-run. It
      # cannot cascade: saveDraft() is called directly at appointment-wizard-shell.spec.ts:825,
      # so the method body stays covered when the debounce does not fire. One line of the twelve.
      # IF THIS FLOOR GOES RED, read the per-file delta FIRST and #965 second -- sending a reader
      # to a one-line cause for a twelve-line budget is how a day gets lost.
      #
      # WHAT THIS FLOOR BUYS, stated so nobody widens a diff without knowing the cost. The
      # changed-path classifier's `angular/*` case sets `frontend=true` and nothing else, so an
      # angular-only pull request leaves the backend NOT APPLICABLE -- see the `applicable()`
      # helper in this job's "Evaluate floors" step -- and `Coverage: Floors` returns FULLY GREEN,
      # which makes any red on such a submission real signal. Add one docs/ or .github/ file and
      # the classifier's `shared=true` arm makes the backend applicable. While FLOOR_BACKEND was a
      # target set above the measurement (75, until 2026-09-24) that failed the job and forfeited
      # the signal. At 85, once the in-flight test pull requests merge (see FLOOR_BACKEND), the
      # backend sits below the measurement and passes, so the signal survives unless backend
      # coverage has genuinely fallen.
      #
      # REFERRED TO BY NAME RATHER THAN BY LINE, deliberately. A first draft of this paragraph
      # cited `:150-152` and `:1274-1280`. The first pointed at the SHARED arm rather than the
      # angular one, and the second was already stale when it was written, because the 80 lines
      # of comment above it had pushed `applicable()` down by exactly that much. A line number in
      # a comment is invalidated by the comment itself.
      FLOOR_FRONTEND: "90"
      # BACKEND -- MEASURED, by the mechanism this job was built around. It was
      # deliberately unset until 2026-09-03 so the gate's own first run would
      # fail and print the figure, which is exactly what happened:
      #
      #   run 97ea9356  backend: measured 73.61% (33197/45098 lines over 887 files)
      #
      # 887 is the load-bearing number, not the percentage. It is the count of
      # this repo's tracked, non-excluded .cs files present in the report, and it
      # confirms both contamination exclusions matched: 1082 would mean neither,
      # 951 only the third-party one, 1012 only the generated one.
      #
      # 73 UNTIL 2026-09-04, AND IT WAS NEVER RIGHT -- it silently omitted an
      # entire process. Phase 3 APP-OWN-01 asserts the tenant-resolver chain in
      # BOTH the API and the AuthServer, which needs a ProjectReference to the
      # AuthServer, which loads that assembly during the run, which puts its lines
      # in the denominator for the first time. Adrian's ruling: re-baseline to the
      # honest figure, exactly as item 2.13 did on the front end (69 -> 20). His
      # words: it is not a number that got worse, it is a number that was never
      # right.
      #
      # MEASURED on this branch, not on the earlier probe, because the probe used
      # a throwaway test that only touched typeof(...) while the real test
      # exercises both modules:
      #
      #   backend: 72.47% (33255/45891 lines over 916 files)
      #
      # 916 is this one's load-bearing number: 887 + 29 AuthServer files. If a
      # future run reports 961, the MessagePack exclusion has stopped matching and
      # the figure is contaminated again rather than improved.
      #
      # THE CONTAMINATION THAT DID NOT GET BAKED IN. The naive reading of that
      # same report is 68.25% over 961 files. Five of those points are MessagePack
      # source-generator source arriving through SourceLink, not our code; see
      # .coverage-exclusions. A floor of 68 would have DRIFTED on every MessagePack
      # bump. Found only because the probe was run twice, against a control that
      # reproduced this file's own 73.61% exactly.
      #
      # 72 UNTIL 2026-09-18, AND IT WAS GRADING TEST CODE AS PRODUCTION. The three
      # test-code entries in .coverage-exclusions are `tests/` PLURAL; the C# projects
      # live in `test/` SINGULAR and matched none of them. So 326 C# test files sat in
      # the denominator at 99.22%, because test code is covered by construction.
      #
      # MEASURED at c035a2a0, one report and one run:
      #
      #   backend: 65.94% (17601/26691 lines over 645 files)
      #
      # with the contaminated reading being 82.66% (44331/53631 over 971) and the test
      # half alone 26730/26940 = 99.22% over 326 files. Both halves reconcile exactly.
      #
      # Same ruling as the 73 -> 72 re-baseline above and the front end's 69 -> 20: a
      # number that was never right, not a number that got worse. NOT a coverage
      # regression -- no production line's coverage changed, only which files count.
      #
      # 645 IS THIS ONE'S LOAD-BEARING NUMBER, replacing 916. And 916 had already
      # drifted: the gate reported 971 by 2026-09-18, PAST the 961 named above as the
      # contamination signal, so that tripwire could never fire again while still
      # reading as armed. Accounted for rather than assumed:
      #
      #   916 + 56 report entries added since a8e221df - 1 deleted = 971  (exact)
      #   of those 56: 52 under test/, 4 under src/
      #
      # 93% test files, which is why it could not hold: this epic's tranches add test
      # files continuously. 645 counts PRODUCTION files only, so it moves when
      # production moves -- which is the property a contamination detector needs. If a
      # future run reports 971 again, `**/test/**` has stopped matching.
      #
      # 85 FROM 2026-09-24, ADRIAN'S END STATE FOR THE TEST PUSH. READ THIS BEFORE "CORRECTING" IT.
      #
      # HISTORY, kept so `git log` does not read as a mistake. #971 set 65, the honest truncate-down
      # of 67.73% (18077/26691 lines over 645 files at 52662e89). On 2026-09-18 Adrian raised it to
      # 75, SEVEN points above the measurement, as a TARGET to force the coverage work ("we are going
      # to get the coverage up anyways"). It failed every pull request carrying this file until the
      # backend reached 75, and those merges were admin-overridden with the failed checks confirmed
      # each time. This block's git history has the full procedure and its 2026-09-18 correction.
      #
      # THAT TARGET WAS MET. Against the epic, backend measured 81.34% (21734/26720 lines over 646
      # files) on #1053's run 36035624090, and 83.42% (22290/26720) on #1056's sharded run
      # 36043940417. On 2026-09-24 Adrian first pinned the floor at 80 ("Pin at 80, finish
      # in-flight"). Later that day he set the END STATE of the phase-8 test-writing push instead:
      # once the in-flight test pull requests take the backend to about 89-91%, this floor is 85 and
      # test writing for the phase ends.
      #
      # SO THIS CHANGE MERGES LAST. At 83.42% it sits ABOVE the measurement and fails until those
      # pull requests merge; after they merge it is a whole number a few points BELOW the
      # measurement. 85 is his figure, not the truncate-down arithmetic, so do not raise it to
      # "match" a newer measurement without asking, and do not lower it to make a red go away.
      #
      # ONCE THAT HAS HAPPENED, this floor is a BACKSTOP again. The paragraph above that begins "THE
      # ABSOLUTE FLOORS ARE NOT THE SENSITIVE CONTROL" describes it once more: FLOOR_CHANGED is the
      # per-PR control, and this one catches slow erosion, so a red means backend coverage fell
      # below 85.
      FLOOR_BACKEND: "85"
      # PYTHON -- MEASURED, by the same mechanism as the other two: the gate
      # refuses to run without a floor and prints the figure to copy.
      #
      #   scripts/coverage-gate.py --python-cobertura coverage.xml --measure-only
      #   -> python: 30.98% (435/1404 lines over 8 files)
      #
      # THE DENOMINATOR HAZARD THIS BLOCK USED TO DESCRIBE IS FIXED (#862), and
      # the number moved a long way because of it. What stood here before was a
      # careful account of a percentage that was a function of WHICH FILES THE
      # SUITE IMPORTS -- 56.40% over 2 files, then 71.80%, then 53.72% over 4,
      # each move caused by an import appearing rather than by code changing.
      # Writing a test for something previously untested LOWERED it.
      #
      # pyproject.toml now sets `include_namespace_packages` under
      # [tool.coverage.report], which lifts coverage's package-recursion rule and
      # so discovers in-scope files that nothing imports. Measured both ways on
      # the coverage 7.15.2 this job pins:
      #
      #   before : 62.68% (435/694 lines over 4 files)
      #   after  : 30.98% (435/1404 lines over 8 files)
      #
      # SAME NUMERATOR. The denominator doubles because four files that SHIP --
      # the three build_*.py packet generators and check_fields.py, copied into
      # the packet-renderer image and run at its build -- were not in it at all.
      # Phase 8.1 in .coverage-exclusions had already ruled that those 882 lines
      # stay in the denominator deliberately; the measurement simply was not
      # doing it. So 30.98% is not a regression from 62.68%. It is what this
      # repository's Python coverage has been the whole time.
      #
      # THE RATCHET NOW POINTS THE RIGHT WAY, which is the actual deliverable.
      # Those files sit in the denominator at 0%, so the first test for one
      # RAISES this figure. Before, it lowered it: #843 added import-issues.py at
      # 18% and took the total from 58% to 37%.
      #
      # THE FILE-COUNT TRIPWIRE IS BACK, and it is a SET rather than a count this
      # time. The previous one was removed for being calibrated at 2 when the real
      # count was 4, which made it worse than nothing. A count cannot say WHICH
      # file moved; tests/python/python-coverage-denominator.txt is the committed
      # set, checked in two places -- by
      # tests/python/test_python_coverage_denominator.py against `git ls-files`
      # plus the omit patterns, and by scripts/python-coverage.sh against the
      # generated report. A denominator change now fails and names the file
      # instead of quietly moving this percentage.
      #
      # IF YOU CHANGE THAT SET, re-derive this number from a fresh --measure-only
      # run in the same pull request. Do not tune it to make something pass.
      #
      # 30 UNTIL 2026-09-18, BY WHICH POINT IT PROTECTED NOTHING. Phase-8 Python work took this
      # from 30.98% to 92.05%, and the floor never followed -- two thirds of the suite could have
      # been deleted without tripping it.
      #
      #   main, CI run 35389217126 (head 24e36c18):
      #     python: measured 92.05% (1273/1383 lines over 8 files)
      #
      # THE DENOMINATOR DID NOT MOVE, WHICH IS THE POINT IN A BLOCK LIKE THIS ONE. Against the
      # 30.98% recorded above:
      #
      #     denominator   1404 -> 1404   unchanged, 8 files both times
      #     numerator      435 -> 1294
      #
      # Everything above this line is the story of a percentage that used to move for DENOMINATOR
      # reasons -- 56.40% over 2 files, then 71.80%, then 53.72% over 4, each move caused by an
      # import appearing rather than by code changing, and once by a new test LOWERING it. An
      # unchanged denominator is what proves the committed-file-set tripwire held and that this
      # rise is real coverage rather than the measurement shifting underneath it again.
      #
      # 90, NOT 92, AND THAT IS A DELIBERATE DEPARTURE FROM THE TRUNCATE-DOWN CONVENTION at :985
      # (which gave 73 from 73.6064 and 20 from 20.97). The reason is headroom: the PR review lane
      # flagged FLOOR_BACKEND's 0.94 points on #971 as too tight, because one production file added
      # without tests can turn CI red on a submission that did nothing wrong. 90 against 92.05%
      # leaves 2.05 points, about 28 lines of the 1,383-line denominator.
      #
      # THE RATCHET RUNS THE RIGHT WAY HERE, which is why that headroom is a cushion and not a
      # slow leak: the shipping files described above sit in the denominator at 0%, so the first
      # test written for one RAISES this figure.
      #
      # THE FRONTEND HALF WAS HELD AT #979 AND IS NOW DONE (2026-09-21). This paragraph used to
      # read "Frontend measures 74.78% on main; the proposed 75 would sit 0.22 points ABOVE the
      # measurement and fail every pull request to main", which was true when written and went
      # false the moment the epic cascaded to `main` on 2026-09-19. Frontend now measures 80.19%
      # there, and FLOOR_FRONTEND above became 80 -- the convention figure, not the 75 #979 proposed
      # (and 90 from 2026-09-24; see its own block).
      # Kept as a correction rather than deleted, per this file's convention: an entry that argues
      # FROM a measurement outlives the measurement, and this one was found only because the
      # change that invalidated it went looking for entries citing the old number.
      FLOOR_PYTHON: "90"
      # The changed-lines floor, per Adrian's settled decision and the EARS
      # criterion in 02-enforcement.md. Unlike the two absolute floors this one
      # is a fixed policy number rather than a measurement, so it is set here
      # rather than discovered by a first run.
      #
      # 80 SINCE 2026-09-23 (was 90). Adrian ruled that SonarCloud's new_coverage >= 80% is the
      # requirement for new code in fix and feature PRs, and this floor now matches it. It is
      # POOLED across stacks, so backend, frontend and Python changed lines all moved together.
      # The same day #1024 made it measure backend lines at all.
      FLOOR_CHANGED: "80"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Required by the changed-lines floor: it diffs against the merge base
          # with the base branch, which a shallow clone does not contain. The
          # step below fails loudly rather than silently measuring nothing if
          # the base ref is somehow still unresolvable.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.x"

      # continue-on-error belongs on these two steps and nowhere else in this
      # job. A stack that legitimately did not run has no artefact, and
      # download-artifact failing is not itself the verdict -- the verdict is
      # reached explicitly in "Evaluate floors", which fails when a report is
      # absent while its stack is applicable. This is STEP level: job-level
      # continue-on-error would mask the job's conclusion, the opposite of what
      # this gate is for.
      - name: Download backend coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true
        with:
          name: backend-coverage
          path: artifacts/backend

      - name: Download frontend coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true
        with:
          name: frontend-coverage
          path: artifacts/frontend

      - name: Download python coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true
        with:
          name: python-coverage
          path: artifacts/python

      - name: Evaluate floors
        env:
          CLASSIFIER_RESULT: ${{ needs.changes.result }}
          CHANGED_BACKEND: ${{ needs.changes.outputs.backend }}
          CHANGED_FRONTEND: ${{ needs.changes.outputs.frontend }}
          CHANGED_SHARED: ${{ needs.changes.outputs.shared }}
          CHANGED_UNCLASSIFIED: ${{ needs.changes.outputs.unclassified }}
          BACKEND_TEST_RESULT: ${{ needs.backend-test.result }}
          FRONTEND_TEST_RESULT: ${{ needs.frontend-test.result }}
          PYTHON_TEST_RESULT: ${{ needs.python-test.result }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Deny by default, exactly as backend-build's own `if:` does. If the
          # classifier did not itself succeed we cannot trust a word of its
          # output, so every stack is treated as applicable and must produce a
          # report. `unclassified` is included for the same reason: item 0.5
          # made an unrecognised path run the full suite, so this gate has to
          # agree with that or it contradicts the classifier it depends on.
          applicable() {
            [ "$CLASSIFIER_RESULT" != "success" ] && return 0
            [ "$1" = "true" ] && return 0
            [ "$CHANGED_SHARED" = "true" ] && return 0
            [ "$CHANGED_UNCLASSIFIED" = "true" ] && return 0
            return 1
          }

          fail=0

          # Resolve by search rather than by a fixed path. upload-artifact@v4
          # roots an artefact at the least common ancestor of the files it
          # matched, so a glob matching one file yields a different layout than
          # one matching two. Searching by name is indifferent to that.
          #
          # Three deliberate details, each of which was wrong in a first draft:
          #  - NO `2>/dev/null`. Suppressing find's stderr would report "no
          #    report" for a permission error exactly as for a genuine absence,
          #    and the gate would then fail for the wrong stated reason. The
          #    only EXPECTED absence is the directory itself, so that is tested
          #    explicitly and everything else stays loud.
          #  - `-print -quit` rather than `| head -1`. Under `pipefail` a pipe
          #    into head fails the whole pipeline when find is killed by SIGPIPE
          #    after the first match, which `set -e` would turn into a silent
          #    step abort with no diagnostic at all.
          #  - returns empty, not an error, when the directory is missing. That
          #    is the normal case for a stack whose job was skipped, and the
          #    verdict on it belongs to check_stack, not here.
          find_report() {
            if [ ! -d "$1" ]; then
              return 0
            fi
            find "$1" -type f -name "$2" -print -quit
          }

          BACKEND_REPORT="$(find_report artifacts/backend coverage.cobertura.xml)"
          FRONTEND_REPORT="$(find_report artifacts/frontend lcov.info)"
          PYTHON_REPORT="$(find_report artifacts/python coverage.xml)"

          check_stack() {
            label="$1"; changed="$2"; result="$3"; report="$4"
            if applicable "$changed"; then
              echo "$label: APPLICABLE (classifier=$CLASSIFIER_RESULT changed=$changed shared=$CHANGED_SHARED unclassified=$CHANGED_UNCLASSIFIED)"
              if [ "$result" != "success" ]; then
                # Built across several assignments purely to keep the source
                # lines short; the annotation itself must stay on ONE line,
                # because a literal newline inside ::error:: truncates it.
                m="$label coverage is applicable to this change, but its test"
                m="$m job reported '$result' rather than 'success'. Refusing to"
                m="$m draw a coverage conclusion from a run that did not complete."
                echo "::error::$m"
                fail=1
                return 0
              fi
              if [ -z "$report" ]; then
                m="$label coverage is applicable and its test job succeeded, yet"
                m="$m no coverage report was uploaded. A missing report is a"
                m="$m FAILURE here, never an absent constraint -- that is"
                m="$m precisely how a gate comes to pass without measuring anything."
                echo "::error::$m"
                fail=1
                return 0
              fi
              echo "$label: report at $report"
            else
              echo "$label: NOT APPLICABLE"
              # 'skipped' is the only coherent result for a stack this change
              # does not touch. 'failure' or 'cancelled' means something ran and
              # went wrong, and must never be read as "nothing to check here".
              if [ "$result" != "skipped" ]; then
                m="$label coverage is not applicable to this change, so its test"
                m="$m job should have been 'skipped', but it reported '$result'."
                m="$m That combination is incoherent and is treated as a failure"
                m="$m rather than as an absent constraint."
                echo "::error::$m"
                fail=1
              fi
            fi
            return 0
          }

          check_stack backend "$CHANGED_BACKEND" "$BACKEND_TEST_RESULT" "$BACKEND_REPORT"
          check_stack frontend "$CHANGED_FRONTEND" "$FRONTEND_TEST_RESULT" "$FRONTEND_REPORT"

          # Python is checked WITHOUT applicable(), and deliberately so. The
          # python-test job carries no `if:` and no `needs:` -- it was written
          # unconditional precisely so it could not be skipped into a false
          # Success -- so there is no "not applicable" state to represent here.
          # Anything other than a succeeded job with a report is a failure.
          if [ "$PYTHON_TEST_RESULT" != "success" ]; then
            m="python coverage is always applicable -- its test job is"
            m="$m unconditional -- but that job reported '$PYTHON_TEST_RESULT'"
            m="$m rather than 'success'. Refusing to draw a coverage conclusion"
            m="$m from a run that did not complete."
            echo "::error::$m"
            fail=1
          elif [ -z "$PYTHON_REPORT" ]; then
            m="python coverage is always applicable and its test job succeeded,"
            m="$m yet no coverage report was uploaded. A missing report is a"
            m="$m FAILURE here, never an absent constraint."
            echo "::error::$m"
            fail=1
          else
            echo "python: report at $PYTHON_REPORT"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::Coverage gate failed on input validity before any floor was evaluated."
            exit 1
          fi

          args=()
          if applicable "$CHANGED_BACKEND"; then
            # --cobertura-prefix stays at its empty default. dotnet-coverage
            # writes ABSOLUTE checkout paths, and a prefix can only prepend, so
            # coverage-gate.py removes the checkout root itself when it reads the
            # report (#1024). Before that, no backend path matched the diff and
            # the changed-lines floor passed every backend PR unmeasured.
            args+=(--cobertura "$BACKEND_REPORT" --floor-backend "$FLOOR_BACKEND")
          fi
          if applicable "$CHANGED_FRONTEND"; then
            # karma writes `SF:src\app\...` -- backslashes, and relative to
            # angular/, not to the repo root. Without this prefix the
            # `angular/src/app/proxy/**` exclusion matches nothing, and the 55
            # ABP-generated proxy files in the report are graded as ours:
            # 20.74% over 324 files instead of 20.97% over 269. Passed
            # explicitly even though the script defaults to it, so the value CI
            # relies on is visible here rather than only in the script.
            #
            # Measured 2026-09-04, after item 2.13 widened instrumentation. The
            # percentages are now close because the proxy files are largely
            # uncovered too, so the reason to keep this is WHOSE code is being
            # graded, not the size of the number it moves.
            args+=(--lcov "$FRONTEND_REPORT" --lcov-prefix angular --floor-frontend "$FLOOR_FRONTEND")
          fi
          # No prefix argument: coverage.py writes repo-relative filenames
          # already, unlike karma's lcov. Verified against a real coverage.xml
          # (".claude/scripts/verify_structure.py", not "scripts/..."), which is
          # also what makes the shared exclusions match.
          args+=(--python-cobertura "$PYTHON_REPORT" --floor-python "$FLOOR_PYTHON")

          # WAS an early exit for "neither stack applicable". #787 made that
          # unreachable: python is always appended, so args is never empty. The
          # branch is kept INVERTED rather than deleted, because "the gate had
          # nothing to evaluate" is exactly the silent-pass state this job
          # exists to prevent -- if args is ever empty again, that is a wiring
          # bug and should be loud rather than a clean exit 0.
          if [ "${#args[@]}" -eq 0 ]; then
            m="No coverage arguments were assembled. Python is unconditional and"
            m="$m must always contribute, so an empty argument list means this"
            m="$m job is mis-wired -- failing rather than passing on no input."
            echo "::error::$m"
            exit 1
          fi

          # The changed-lines floor. Added only once at least one stack is
          # applicable, because the changed-lines percentage is a question about
          # coverage reports, and with none of them present there is nothing to
          # ask it of.
          #
          # AND ONLY ON A PULL REQUEST (#836, 2026-09-11). `github.base_ref` is
          # populated only for `pull_request` events, so on a push to `main` the
          # line below built the literal `origin/` and the guard beneath it
          # failed this job on EVERY push to the trunk. That guard is correct
          # and stays exactly as it was: it exists for a shallow clone, where a
          # base SHOULD resolve and does not. A push is a different case -- it
          # legitimately has no base branch -- and must not be answered by
          # failing, because a permanently red trunk teaches people to ignore
          # the colour.
          #
          # This is the answer the `changes` job already gives one job above
          # (added by #828 the same day, for the same failure): on the trunk,
          # STATE it rather than derive it. The absolute floors still run and
          # still gate; only the changed-lines question is withheld, because
          # "how well did this submission cover what it touched" has no meaning
          # for a commit that is already on `main`.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "changed-lines: skipped, event '$EVENT_NAME' has no base branch to diff against."
            echo "Coverage floors: changed-lines skipped (no base branch on this event); absolute floors still enforced." >> "$GITHUB_STEP_SUMMARY"
          else
            # `...` is deliberate: two dots would also attribute every change that
            # landed on the base branch since this one was cut. The empty case is
            # handled inside the gate, which exits 0 when no CHANGED line is
            # coverable -- a docs-only submission must not fail this.
            base="origin/${BASE_REF}"
            if ! git rev-parse --verify --quiet "$base" >/dev/null; then
              m="cannot resolve '$base', so the changed-lines floor has nothing to"
              m="$m diff against. This needs fetch-depth: 0 on checkout. Failing"
              m="$m rather than skipping the check, which would pass silently."
              echo "::error::$m"
              exit 1
            fi
            git diff --unified=0 --diff-filter=ACMR "$base...HEAD" > changed.diff
            echo "changed-lines: diffed against $base"
            args+=(--changed-diff changed.diff --floor-changed "$FLOOR_CHANGED")
          fi

          # NOT piped into tee, and the exit code is carried by hand. Under
          # `pipefail` a failing gate would abort the step immediately and the
          # step summary below would never be written -- and the first run of
          # this job FAILS BY DESIGN, so that is precisely the run whose measured
          # backend figure somebody needs to read.
          set +e
          # #683: refuse to grade a dependency's source as ours. SourceLink has
          # embedded third-party source into the backend report twice, each time
          # fixed by naming that vendor in .coverage-exclusions -- a list that
          # grows one vendor at a time, where the next one matches nothing and
          # arrives with no signal.
          #
          # DISCOVERY MOVED INTO THE GATE, reversing the rationale #856 wrote
          # here. That rationale was that keeping the script free of subprocess
          # calls keeps it testable -- which is true, and is why the
          # --tracked-files flag survives for tests and for anywhere without
          # git. But as the ONLY mechanism it made the check optional in the
          # worst way: delete this one line and the guard disappears having
          # printed a notice, which is the exact shape of hole #683 exists to
          # close. The gate now runs `git ls-files` itself and EXITS if that
          # fails -- "cannot list" is neither "nothing is tracked" nor
          # "everything is tracked".
          python scripts/coverage-gate.py --exclusions .coverage-exclusions "${args[@]}" > gate-output.txt 2>&1
          gate_rc=$?
          set -e
          cat gate-output.txt
          {
            echo "### Coverage floors"
            echo ""
            echo '```text'
            cat gate-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$gate_rc"

  # #1032: SonarCloud analysis, moved here from the deleted sonarcloud.yml so it reuses the coverage
  # the test jobs above already produced. That workflow ran every suite a second time -- the backend
  # alone for about 21 min -- only to write coverage in the formats SonarCloud reads. Now the
  # backend aggregate merges its shards straight into that XML, and the Angular lcov and Python
  # Cobertura are the same artifacts Coverage: Floors reads.
  sonarcloud:
    name: "SonarCloud: Analysis"
    runs-on: ubuntu-latest
    needs: [changes, backend-test, frontend-test, python-test]
    # Analyse unless a test job failed or was cancelled (sonarcloud.yml could not analyse a failed
    # run either: its test step failed first). A SKIPPED stack is fine: the PR changes no code
    # there, and SonarCloud's quality gate is about new code.
    if: >-
      ${{ always()
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled') }}
    # Carried over from sonarcloud.yml. This check is not required on main; SonarCloud's verdict
    # is the separate "SonarCloud Code Analysis" check its app posts.
    continue-on-error: true
    # Build plus scanner, no tests: 60 in sonarcloud.yml covered the test runs too.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner --version 11.3.0
      - name: Generate NuGet.Config
        run: sed "s/\${ABP_NUGET_API_KEY}/${{ secrets.ABP_NUGET_API_KEY }}/" NuGet.Config.template > NuGet.Config
      - name: Create placeholder secrets files
        run: |
          for dir in src/HealthcareSupport.CaseEvaluation.AuthServer                      src/HealthcareSupport.CaseEvaluation.HttpApi.Host                      src/HealthcareSupport.CaseEvaluation.DbMigrator                      test/HealthcareSupport.CaseEvaluation.TestBase                      test/HealthcareSupport.CaseEvaluation.HttpApi.Client.ConsoleTestApp; do
            if [ -n "${{ secrets.ABP_LICENSE_CODE }}" ]; then
              echo "{\"AbpLicenseCode\": \"${{ secrets.ABP_LICENSE_CODE }}\"}" > "$dir/appsettings.secrets.json"
            else
              echo '{}' > "$dir/appsettings.secrets.json"
            fi
          done
      - name: Build the shared coverage-exclusion list
        run: |
          set -euo pipefail
          list=$(grep -v '^[[:space:]]*#' .coverage-exclusions \
                 | grep -v '^[[:space:]]*$' | paste -sd, -)
          # Absent input is a hard failure. An empty list here would silently
          # analyse with NO coverage exclusions and move every figure, which is
          # the same shape as a gate that passes by not running.
          if [ -z "$list" ]; then
            m="No patterns read from .coverage-exclusions. Refusing to analyse"
            m="$m with an empty exclusion list, which would silently change"
            m="$m every coverage figure this project reports."
            echo "::error::$m"
            exit 1
          fi
          echo "COVERAGE_EXCLUSIONS=$list" >> "$GITHUB_ENV"
          echo "Coverage exclusions: $list"

      # #787, SonarCloud's half. Without a Python report Sonar grades EVERY new
      # Python line as uncovered, so any pull request touching Python fails the
      # new_coverage condition at 0% -- observed on PR #854, whose only new
      # Python was a twenty-line import block.
      #
      # NOT `coverage.xml`: the .NET step below writes that name at the
      # repository root for sonar.cs.vscoveragexml.reportsPaths. Two reports
      # under one name means one silently overwrites the other.
      #
      # Same script ci.yml's python-test job runs, so the two consumers cannot
      # diverge in flags. The gate is then asked to parse the very file being
      # handed to Sonar: if it cannot, the two consumers are looking at
      # different things and that should be loud here rather than discovered as
      # a disagreement in figures months later.
      #
      # NOT hash-pinned, and that is item 2.14's decision rather than an oversight
      # (#700). Scorecard's PinnedDependenciesID wants --require-hashes against a
      # requirements file carrying a hash for every transitive dependency. Declined
      # for the same reason docker/packet-renderer/Dockerfile records: PyPI does not
      # permit a published version to be re-uploaded with different content, so the
      # residual risk a hash closes is a registry compromise, against which the cost
      # is a lock file regenerated in full on every bump. The reason is repeated here
      # because this is where a reader lands, not that Dockerfile.
      # Each report is fetched only when its test job succeeded; a skipped stack has none.
      - name: Download backend coverage (VS XML)
        if: needs.backend-test.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: backend-coverage-xml
          path: sonar-coverage/backend
      - name: Download frontend coverage (lcov)
        if: needs.frontend-test.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: frontend-coverage
          path: angular/coverage
      - name: Download python coverage (Cobertura)
        if: needs.python-test.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: python-coverage
          path: sonar-coverage/python
      - name: SonarScanner begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"gesco-healthcare-support_hcs-patient-portal"
          /o:"gesco-healthcare-support"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.vscoveragexml.reportsPaths="sonar-coverage/backend/coverage.xml"
          /d:sonar.javascript.lcov.reportPaths="angular/coverage/**/lcov.info"
          /d:sonar.typescript.lcov.reportPaths="angular/coverage/**/lcov.info"
          /d:sonar.python.coverage.reportPaths="sonar-coverage/python/coverage.xml"
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,angular/src/app/proxy/**,**/Migrations/**,**/TenantMigrations/**,**/*.abstract.*.ts,design_handoff_*/**"
          /d:sonar.coverage.exclusions="$COVERAGE_EXCLUSIONS"
          /d:sonar.issue.ignore.multicriteria=abpModelState,abpLookupLabel,abpLookupLabelHtml,abpDiAppServiceParams,abpDiManagerParams,abpDiRepoParams,abpPermissionStrings,abpAppServiceI18nKeys,abpHostModuleConfigKeys,abpDavailComplexity,bootstrapModalDialogRole,emailDoctype,emailTitle,emailLang,emailTableHeader,emailMouseKeyboard,emailDeprecatedAttrs,emailLayoutTable
          /d:sonar.issue.ignore.multicriteria.abpModelState.ruleKey=csharpsquid:S6967
          /d:sonar.issue.ignore.multicriteria.abpModelState.resourceKey=**/*.cs
          /d:sonar.issue.ignore.multicriteria.abpLookupLabel.ruleKey=Web:S6853
          /d:sonar.issue.ignore.multicriteria.abpLookupLabel.resourceKey=**/*.cshtml
          /d:sonar.issue.ignore.multicriteria.abpLookupLabelHtml.ruleKey=Web:S6853
          /d:sonar.issue.ignore.multicriteria.abpLookupLabelHtml.resourceKey=**/*.html
          /d:sonar.issue.ignore.multicriteria.abpDiAppServiceParams.ruleKey=csharpsquid:S107
          /d:sonar.issue.ignore.multicriteria.abpDiAppServiceParams.resourceKey=**/*AppService.cs
          /d:sonar.issue.ignore.multicriteria.abpDiManagerParams.ruleKey=csharpsquid:S107
          /d:sonar.issue.ignore.multicriteria.abpDiManagerParams.resourceKey=**/*Manager.cs
          /d:sonar.issue.ignore.multicriteria.abpDiRepoParams.ruleKey=csharpsquid:S107
          /d:sonar.issue.ignore.multicriteria.abpDiRepoParams.resourceKey=**/I*Repository.cs
          /d:sonar.issue.ignore.multicriteria.abpPermissionStrings.ruleKey=csharpsquid:S1192
          /d:sonar.issue.ignore.multicriteria.abpPermissionStrings.resourceKey=**/CaseEvaluationPermission*.cs
          /d:sonar.issue.ignore.multicriteria.abpAppServiceI18nKeys.ruleKey=csharpsquid:S1192
          /d:sonar.issue.ignore.multicriteria.abpAppServiceI18nKeys.resourceKey=**/*AppService.cs
          /d:sonar.issue.ignore.multicriteria.abpHostModuleConfigKeys.ruleKey=csharpsquid:S1192
          /d:sonar.issue.ignore.multicriteria.abpHostModuleConfigKeys.resourceKey=**/CaseEvaluationHttpApi*Module.cs
          /d:sonar.issue.ignore.multicriteria.abpDavailComplexity.ruleKey=csharpsquid:S3776
          /d:sonar.issue.ignore.multicriteria.abpDavailComplexity.resourceKey=**/DoctorAvailabilities/DoctorAvailabilitiesAppService.cs
          /d:sonar.issue.ignore.multicriteria.bootstrapModalDialogRole.ruleKey=Web:S6819
          /d:sonar.issue.ignore.multicriteria.bootstrapModalDialogRole.resourceKey=**/*.component.html
          /d:sonar.issue.ignore.multicriteria.emailDoctype.ruleKey=Web:DoctypePresenceCheck
          /d:sonar.issue.ignore.multicriteria.emailDoctype.resourceKey=**/NotificationTemplates/EmailBodies/*.html
          /d:sonar.issue.ignore.multicriteria.emailTitle.ruleKey=Web:PageWithoutTitleCheck
          /d:sonar.issue.ignore.multicriteria.emailTitle.resourceKey=**/NotificationTemplates/EmailBodies/*.html
          /d:sonar.issue.ignore.multicriteria.emailLang.ruleKey=Web:S5254
          /d:sonar.issue.ignore.multicriteria.emailLang.resourceKey=**/NotificationTemplates/EmailBodies/*.html
          /d:sonar.issue.ignore.multicriteria.emailTableHeader.ruleKey=Web:S5256
          /d:sonar.issue.ignore.multicriteria.emailTableHeader.resourceKey=**/NotificationTemplates/EmailBodies/*.html
          /d:sonar.issue.ignore.multicriteria.emailMouseKeyboard.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
          /d:sonar.issue.ignore.multicriteria.emailMouseKeyboard.resourceKey=**/NotificationTemplates/EmailBodies/*.html
          /d:sonar.issue.ignore.multicriteria.emailDeprecatedAttrs.ruleKey=Web:S1827
          /d:sonar.issue.ignore.multicriteria.emailDeprecatedAttrs.resourceKey=**/NotificationTemplates/EmailBodies/*.html
          /d:sonar.issue.ignore.multicriteria.emailLayoutTable.ruleKey=Web:S5257
          /d:sonar.issue.ignore.multicriteria.emailLayoutTable.resourceKey=**/NotificationTemplates/EmailBodies/*.html
          /d:sonar.qualitygate.wait=false

      # --locked-mode (#687): scan the graph we actually declare.
      #
      # packages.lock.json is committed so dependency-review can see transitive
      # NuGet packages, and Directory.Build.props says CI "can opt in via the
      # dotnet restore flag for locked mode". It never did. With the flag absent a
      # pull request could add a dependency, leave the lock file stale, and
      # Dependency Review -- a REQUIRED check -- would scan a graph without the new
      # packages in it and pass. That happened on #686: an added ProjectReference
      # pulled OpenIddict in transitively, the lock file had zero OpenIddict.Server
      # entries, and build, tests and git status were all clean.
      #
      # Now it is NU1004 instead: "The package references have changed ... restore
      # can't be run in locked mode". RestoreLockedMode stays FALSE locally, per the
      # existing reasoning, so day-to-day package tweaks are unaffected; the cost is
      # that a dependency change must be followed by
      # `dotnet restore --force-evaluate` and the lock files committed.
      - run: dotnet restore HealthcareSupport.CaseEvaluation.slnx --locked-mode
      - run: dotnet build HealthcareSupport.CaseEvaluation.slnx --no-restore -c Release
      - name: SonarScanner end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
