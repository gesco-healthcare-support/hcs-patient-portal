name: CI

on:
  pull_request:
    branches:
      [
        main,
        development,
        staging,
        production,
        chore/dependency-updates,
        "feat/**",
        "fix/**",
      ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  changes:
    name: "Meta: Changed paths"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      shared: ${{ steps.classify.outputs.shared }}
      unclassified: ${{ steps.classify.outputs.unclassified }}
    steps:
      # DENY BY DEFAULT (phase 2 item 0.5, 2026-09-03).
      #
      # This replaced `dorny/paths-filter` with an explicit classifier for one
      # reason: the filters were an ALLOWLIST WITH NO CATCH-ALL. 28 tracked
      # top-level paths matched none of the three groups -- all three compose
      # files, `docker/`, `scripts/`, `tools/`, `etc/`, `BannedSymbols.txt`,
      # `.gitignore`, `.env.example` among them. A pull request touching only
      # those set every output to false, so every downstream job's `if:`
      # evaluated false and every job SKIPPED.
      #
      # A skipped job reports "Success" and does NOT block a merge, even when it
      # is a required check. So such a pull request satisfied every required
      # check on `main` and `development` -- where ALL required checks are
      # conditional on this job -- having run none of them.
      #
      # The `*)` arm below is the fix and it is the whole point: anything this
      # classifier does not RECOGNISE is treated as affecting everything, so the
      # full suite runs. A new top-level directory added next year is covered
      # without anyone remembering to come back here. An allowlist cannot
      # self-heal; a fallback can.
      #
      # Keep the genuine saving: a `src/`-only change still skips the frontend
      # jobs, and vice versa.
      - name: Classify the changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          files=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')

          # Absent input is a hard failure, never a silent pass. An empty list
          # here would classify everything as false and skip the whole suite --
          # exactly the defect this job was rewritten to remove.
          if [ -z "$files" ]; then
            echo "::error::No changed files reported for this pull request. Refusing to classify."
            exit 1
          fi

          backend=false
          frontend=false
          shared=false
          unclassified=false

          while IFS= read -r f; do
            case "$f" in
              src/* | test/* | *.sln | *.slnx | Directory.Build.props | \
              NuGet.Config.template | common.props | global.json)
                backend=true
                ;;
              angular/*)
                frontend=true
                ;;
              .github/* | docs/* | .editorconfig | .gitleaks.toml | \
              .markdownlint.json | README.md | CONTRIBUTING.md | CHANGELOG.md)
                shared=true
                ;;
              *)
                # Deny by default. Unrecognised path -> run everything.
                unclassified=true
                echo "unclassified path, will run the full suite: $f"
                ;;
            esac
          done <<< "$files"

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "shared=$shared"
            echo "unclassified=$unclassified"
          } >> "$GITHUB_OUTPUT"

          echo "### Changed-path classification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Group | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ----- | ----- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| backend | \`$backend\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| frontend | \`$frontend\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| shared | \`$shared\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| unclassified | \`$unclassified\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$files" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

  backend-build:
    name: "Backend: Build"
    runs-on: ubuntu-latest
    needs: changes
    # always(): the classifier's OWN failure must not skip this job. If it
    # cannot classify, run -- the same deny-by-default rule as `unclassified`.
    if: >-
      ${{ always() && (needs.changes.result != 'success'
      || needs.changes.outputs.backend == 'true'
      || needs.changes.outputs.shared == 'true'
      || needs.changes.outputs.unclassified == 'true') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/common.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Generate NuGet.Config
        run: sed "s/\${ABP_NUGET_API_KEY}/${{ secrets.ABP_NUGET_API_KEY }}/" NuGet.Config.template > NuGet.Config
      - name: Create placeholder secrets files (ABP requires these to build)
        run: |
          for dir in src/HealthcareSupport.CaseEvaluation.AuthServer \
                     src/HealthcareSupport.CaseEvaluation.HttpApi.Host \
                     src/HealthcareSupport.CaseEvaluation.DbMigrator \
                     test/HealthcareSupport.CaseEvaluation.TestBase \
                     test/HealthcareSupport.CaseEvaluation.HttpApi.Client.ConsoleTestApp; do
            if [ -n "${{ secrets.ABP_LICENSE_CODE }}" ]; then
              echo "{\"AbpLicenseCode\": \"${{ secrets.ABP_LICENSE_CODE }}\"}" > "$dir/appsettings.secrets.json"
            else
              echo '{}' > "$dir/appsettings.secrets.json"
            fi
          done
      - run: dotnet restore HealthcareSupport.CaseEvaluation.slnx
      # Phase 2.1 (2026-09-02): the separate informational `-warnaserror` build was
      # removed here, per its own instruction. It said to remove it once
      # Directory.Build.props set <TreatWarningsAsErrors>true</TreatWarningsAsErrors>,
      # which happened in Phase B-6 PR-0 (see Directory.Build.props:9,:21). The build
      # below therefore already enforces warnings-as-errors, so the extra step was a
      # duplicate full-solution build on every back-end submission.
      - run: dotnet build HealthcareSupport.CaseEvaluation.slnx --no-restore -c Release

      # PHASE 2 ITEM 2.6 -- fail the build on a model change with no migration.
      #
      # Pinned to the version the mechanism was actually verified with, not to
      # "latest". Newer 10.0.x exist; an unpinned tool means the gate's behaviour
      # can change without anyone changing this file.
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.7

      # TWO STEPS, ONE PER CONTEXT, DELIBERATELY NEVER COMBINED.
      #
      # This repo has two schemas: `CaseEvaluationDbContext` (host, Migrations/)
      # and `CaseEvaluationTenantDbContext` (tenant, TenantMigrations/, one
      # database per office). Most entities are mapped in BOTH.
      #
      # A single combined check passes when one of the two is missing, and the
      # ONE-SIDED case is the one that actually breaks here: a migration added to
      # the host set and forgotten in the tenant set produces an office database
      # missing a table, which surfaces as a runtime exception in front of a
      # user. That has shipped before. Two steps means two exit codes, two check
      # lines in the log, and a message naming the right folder -- a generic
      # failure sends people to the wrong migration set.
      #
      # `--no-build` is NOT used, though the Release build above would allow it.
      # The command form below is the one whose exit codes were verified (0 on a
      # clean tree, 1 on a pending change, per context); adding --no-build is an
      # unproven variant, and the cost of being wrong here is a gate that cannot
      # fail. The extra compile is the price of that certainty.
      # A NOTE ON EXIT 1, which is why these steps are not a bare `if`.
      #
      # `has-pending-model-changes` exits 1 for a pending model change AND for
      # any tooling failure -- a broken build, a context it cannot find, a
      # design-time factory that throws. Treating every exit 1 as "you forgot a
      # migration" would print a confident, specific, wrong diagnosis and send
      # someone to write a migration that was never missing.
      #
      # So the output is inspected as well as the exit code. Both outcomes still
      # FAIL: the distinction changes only the message, never the verdict, so a
      # wrong guess about the marker string cannot manufacture a false pass.
      - name: "Migrations: host schema is current"
        run: |
          set -uo pipefail
          P=src/HealthcareSupport.CaseEvaluation.EntityFrameworkCore
          out=$(dotnet ef migrations has-pending-model-changes -c CaseEvaluationDbContext -p "$P" 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            echo "Host schema matches its migrations."
            exit 0
          fi
          # Case-SENSITIVE, and that is the whole point. EF's two messages are
          # "Changes have been made to the model since the last migration." and
          # "No changes have been made to the model since the last migration."
          # -- verified against Microsoft.EntityFrameworkCore.Design.dll 10.0.0,
          # the version this repo references. A case-insensitive match treats
          # those opposites as identical. It is unreachable today because the
          # success message comes with exit 0 and this branch only runs on a
          # non-zero exit, but a matcher that cannot tell "changed" from "not
          # changed" is one refactor away from being wrong.
          if printf '%s' "$out" | grep -q "Changes have been made to the model"; then
            m="The HOST model has changes with no migration in Migrations/."
            m="$m Add one with: dotnet ef migrations add <Name>"
            m="$m -c CaseEvaluationDbContext -o Migrations -p $P"
          else
            m="The host migration check could not complete (exit $rc) and this is"
            m="$m NOT a missing-migration report. Read the output above before"
            m="$m adding any migration."
          fi
          echo "::error::$m"
          exit 1

      - name: "Migrations: tenant schema is current"
        # Runs even when the host step failed. These are two independent
        # schemas, and the ONE-SIDED case is the whole reason this item exists;
        # letting the host failure short-circuit the tenant check would hide
        # exactly half of what the gate is for.
        if: always()
        run: |
          set -uo pipefail
          P=src/HealthcareSupport.CaseEvaluation.EntityFrameworkCore
          out=$(dotnet ef migrations has-pending-model-changes -c CaseEvaluationTenantDbContext -p "$P" 2>&1)
          rc=$?
          printf '%s\n' "$out"
          if [ "$rc" -eq 0 ]; then
            echo "Tenant schema matches its migrations."
            exit 0
          fi
          # Case-SENSITIVE, and that is the whole point. EF's two messages are
          # "Changes have been made to the model since the last migration." and
          # "No changes have been made to the model since the last migration."
          # -- verified against Microsoft.EntityFrameworkCore.Design.dll 10.0.0,
          # the version this repo references. A case-insensitive match treats
          # those opposites as identical. It is unreachable today because the
          # success message comes with exit 0 and this branch only runs on a
          # non-zero exit, but a matcher that cannot tell "changed" from "not
          # changed" is one refactor away from being wrong.
          if printf '%s' "$out" | grep -q "Changes have been made to the model"; then
            m="The TENANT model has changes with no migration in TenantMigrations/."
            m="$m Every office has its own database, so a missing tenant migration"
            m="$m is a runtime failure in front of a user, not a build problem."
            m="$m Add one with: dotnet ef migrations add <Name>"
            m="$m -c CaseEvaluationTenantDbContext -o TenantMigrations -p $P"
          else
            m="The tenant migration check could not complete (exit $rc) and this"
            m="$m is NOT a missing-migration report. Read the output above before"
            m="$m adding any migration."
          fi
          echo "::error::$m"
          exit 1

  docs-structure:
    name: "Docs: Structure Check"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify documentation structure
        run: python .claude/scripts/verify_structure.py
      - name: Check documentation links
        run: python .claude/scripts/check-links.py || true
        # Link check is non-blocking: pre-existing broken links (tracked in
        # docs/verification/BASELINE.md) should not fail CI. The job still
        # prints the full report for visibility.

  backend-test:
    name: "Backend: Test"
    runs-on: ubuntu-latest
    needs: [changes, backend-build]
    # Gated on its build, whose condition already encodes the path logic.
    # always() so a failed classifier does not skip it; the build must have
    # SUCCEEDED, so a skipped or failed build still skips the test.
    if: ${{ always() && needs.backend-build.result == 'success' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/common.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Generate NuGet.Config
        run: sed "s/\${ABP_NUGET_API_KEY}/${{ secrets.ABP_NUGET_API_KEY }}/" NuGet.Config.template > NuGet.Config
      - name: Create placeholder secrets files
        run: |
          for dir in src/HealthcareSupport.CaseEvaluation.AuthServer \
                     src/HealthcareSupport.CaseEvaluation.HttpApi.Host \
                     src/HealthcareSupport.CaseEvaluation.DbMigrator \
                     test/HealthcareSupport.CaseEvaluation.TestBase \
                     test/HealthcareSupport.CaseEvaluation.HttpApi.Client.ConsoleTestApp; do
            if [ -n "${{ secrets.ABP_LICENSE_CODE }}" ]; then
              echo "{\"AbpLicenseCode\": \"${{ secrets.ABP_LICENSE_CODE }}\"}" > "$dir/appsettings.secrets.json"
            else
              echo '{}' > "$dir/appsettings.secrets.json"
            fi
          done
      - run: dotnet restore HealthcareSupport.CaseEvaluation.slnx
      - name: Test
        run: >
          dotnet test HealthcareSupport.CaseEvaluation.slnx
          --no-restore -c Release
          --logger "trx;LogFileName=results.trx"
          --results-directory ./test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: ./test-results
          retention-days: 14

  frontend-build:
    name: "Frontend: Build"
    runs-on: ubuntu-latest
    needs: changes
    # always(): see the note on backend-build.
    if: >-
      ${{ always() && (needs.changes.result != 'success'
      || needs.changes.outputs.frontend == 'true'
      || needs.changes.outputs.shared == 'true'
      || needs.changes.outputs.unclassified == 'true') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: angular/yarn.lock
      # Yarn 4 (Berry) is pinned via package.json packageManager; corepack
      # activates it (must run after setup-node, before any yarn command).
      - run: corepack enable
      - run: yarn install
      - run: yarn build:prod

  frontend-lint:
    name: "Frontend: Lint"
    runs-on: ubuntu-latest
    needs: changes
    # always(): see the note on backend-build.
    if: >-
      ${{ always() && (needs.changes.result != 'success'
      || needs.changes.outputs.frontend == 'true'
      || needs.changes.outputs.shared == 'true'
      || needs.changes.outputs.unclassified == 'true') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: angular/yarn.lock
      # Yarn 4 (Berry) is pinned via package.json packageManager; corepack
      # activates it (must run after setup-node, before any yarn command).
      - run: corepack enable
      - run: yarn install
      - run: yarn lint

  frontend-test:
    name: "Frontend: Test"
    runs-on: ubuntu-latest
    needs: [changes, frontend-build]
    # See the note on backend-test.
    if: ${{ always() && needs.frontend-build.result == 'success' }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: angular/yarn.lock
      # Yarn 4 (Berry) is pinned via package.json packageManager; corepack
      # activates it (must run after setup-node, before any yarn command).
      - run: corepack enable
      - run: yarn install
      - name: Check for test files
        id: check-tests
        # Phase A/B behavior: emit a ::warning annotation when no *.spec.ts
        # files exist (visible in PR UI, not a red ✗). The test step below
        # is gated on has_tests so we skip rather than run yarn test with
        # nothing to execute. Once Phase B #8 adds specs for the 13
        # untested entities, this branch stops firing and the job is a
        # normal green test run.
        #
        # Phase C hardens this: revert to ::error + exit 1 in the else
        # branch, and drop the if-guard on "Run tests with coverage" so
        # the job fails hard if specs are ever removed.
        run: |
          if find src -name "*.spec.ts" | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "Found spec files; proceeding with tests." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No *.spec.ts files found under angular/src. Phase A/B: informational; Phase C will require specs."
          fi
      - name: Run tests with coverage
        if: steps.check-tests.outputs.has_tests == 'true'
        run: yarn test --watch=false --browsers=ChromeHeadless --code-coverage

  backend-format:
    name: "Backend: Format Check"
    runs-on: ubuntu-latest
    needs: changes
    # always(): the classifier's OWN failure must not skip this job. If it
    # cannot classify, run -- the same deny-by-default rule as `unclassified`.
    if: >-
      ${{ always() && (needs.changes.result != 'success'
      || needs.changes.outputs.backend == 'true'
      || needs.changes.outputs.shared == 'true'
      || needs.changes.outputs.unclassified == 'true') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/common.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Generate NuGet.Config
        run: sed "s/\${ABP_NUGET_API_KEY}/${{ secrets.ABP_NUGET_API_KEY }}/" NuGet.Config.template > NuGet.Config
      - name: Create placeholder secrets files
        run: |
          for dir in src/HealthcareSupport.CaseEvaluation.AuthServer \
                     src/HealthcareSupport.CaseEvaluation.HttpApi.Host \
                     src/HealthcareSupport.CaseEvaluation.DbMigrator \
                     test/HealthcareSupport.CaseEvaluation.TestBase \
                     test/HealthcareSupport.CaseEvaluation.HttpApi.Client.ConsoleTestApp; do
            if [ -n "${{ secrets.ABP_LICENSE_CODE }}" ]; then
              echo "{\"AbpLicenseCode\": \"${{ secrets.ABP_LICENSE_CODE }}\"}" > "$dir/appsettings.secrets.json"
            else
              echo '{}' > "$dir/appsettings.secrets.json"
            fi
          done
      - run: dotnet restore HealthcareSupport.CaseEvaluation.slnx
      - run: dotnet format HealthcareSupport.CaseEvaluation.slnx --no-restore --verify-no-changes --verbosity diagnostic

  frontend-format:
    name: "Frontend: Format Check"
    runs-on: ubuntu-latest
    needs: changes
    # always(): see the note on backend-build.
    if: >-
      ${{ always() && (needs.changes.result != 'success'
      || needs.changes.outputs.frontend == 'true'
      || needs.changes.outputs.shared == 'true'
      || needs.changes.outputs.unclassified == 'true') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: angular/yarn.lock
      # Yarn 4 (Berry) is pinned via package.json packageManager; corepack
      # activates it (must run after setup-node, before any yarn command).
      - run: corepack enable
      - run: yarn install
      - run: yarn format:check
