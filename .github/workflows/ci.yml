name: CI

on:
  pull_request:
    branches:
      [
        main,
        development,
        staging,
        production,
        chore/dependency-updates,
        "feat/**",
        "fix/**",
      ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  changes:
    name: "Meta: Changed paths"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      shared: ${{ steps.classify.outputs.shared }}
      unclassified: ${{ steps.classify.outputs.unclassified }}
    steps:
      # DENY BY DEFAULT (phase 2 item 0.5, 2026-09-03).
      #
      # This replaced `dorny/paths-filter` with an explicit classifier for one
      # reason: the filters were an ALLOWLIST WITH NO CATCH-ALL. 28 tracked
      # top-level paths matched none of the three groups -- all three compose
      # files, `docker/`, `scripts/`, `tools/`, `etc/`, `BannedSymbols.txt`,
      # `.gitignore`, `.env.example` among them. A pull request touching only
      # those set every output to false, so every downstream job's `if:`
      # evaluated false and every job SKIPPED.
      #
      # A skipped job reports "Success" and does NOT block a merge, even when it
      # is a required check. So such a pull request satisfied every required
      # check on `main` and `development` -- where ALL required checks are
      # conditional on this job -- having run none of them.
      #
      # The `*)` arm below is the fix and it is the whole point: anything this
      # classifier does not RECOGNISE is treated as affecting everything, so the
      # full suite runs. A new top-level directory added next year is covered
      # without anyone remembering to come back here. An allowlist cannot
      # self-heal; a fallback can.
      #
      # Keep the genuine saving: a `src/`-only change still skips the frontend
      # jobs, and vice versa.
      - name: Classify the changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          files=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')

          # Absent input is a hard failure, never a silent pass. An empty list
          # here would classify everything as false and skip the whole suite --
          # exactly the defect this job was rewritten to remove.
          if [ -z "$files" ]; then
            echo "::error::No changed files reported for this pull request. Refusing to classify."
            exit 1
          fi

          backend=false
          frontend=false
          shared=false
          unclassified=false

          while IFS= read -r f; do
            case "$f" in
              src/* | test/* | *.sln | *.slnx | Directory.Build.props | \
              NuGet.Config.template | common.props | global.json)
                backend=true
                ;;
              angular/*)
                frontend=true
                ;;
              .github/* | docs/* | .editorconfig | .gitleaks.toml | \
              .markdownlint.json | README.md | CONTRIBUTING.md | CHANGELOG.md)
                shared=true
                ;;
              *)
                # Deny by default. Unrecognised path -> run everything.
                unclassified=true
                echo "unclassified path, will run the full suite: $f"
                ;;
            esac
          done <<< "$files"

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "shared=$shared"
            echo "unclassified=$unclassified"
          } >> "$GITHUB_OUTPUT"

          echo "### Changed-path classification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Group | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ----- | ----- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| backend | \`$backend\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| frontend | \`$frontend\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| shared | \`$shared\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| unclassified | \`$unclassified\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$files" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

  backend-build:
    name: "Backend: Build"
    runs-on: ubuntu-latest
    needs: changes
    # always(): the classifier's OWN failure must not skip this job. If it
    # cannot classify, run -- the same deny-by-default rule as `unclassified`.
    if: >-
      ${{ always() && (needs.changes.result != 'success'
      || needs.changes.outputs.backend == 'true'
      || needs.changes.outputs.shared == 'true'
      || needs.changes.outputs.unclassified == 'true') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/common.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Generate NuGet.Config
        run: sed "s/\${ABP_NUGET_API_KEY}/${{ secrets.ABP_NUGET_API_KEY }}/" NuGet.Config.template > NuGet.Config
      - name: Create placeholder secrets files (ABP requires these to build)
        run: |
          for dir in src/HealthcareSupport.CaseEvaluation.AuthServer \
                     src/HealthcareSupport.CaseEvaluation.HttpApi.Host \
                     src/HealthcareSupport.CaseEvaluation.DbMigrator \
                     test/HealthcareSupport.CaseEvaluation.TestBase \
                     test/HealthcareSupport.CaseEvaluation.HttpApi.Client.ConsoleTestApp; do
            if [ -n "${{ secrets.ABP_LICENSE_CODE }}" ]; then
              echo "{\"AbpLicenseCode\": \"${{ secrets.ABP_LICENSE_CODE }}\"}" > "$dir/appsettings.secrets.json"
            else
              echo '{}' > "$dir/appsettings.secrets.json"
            fi
          done
      - run: dotnet restore HealthcareSupport.CaseEvaluation.slnx
      # Phase 2.1 (2026-09-02): the separate informational `-warnaserror` build was
      # removed here, per its own instruction. It said to remove it once
      # Directory.Build.props set <TreatWarningsAsErrors>true</TreatWarningsAsErrors>,
      # which happened in Phase B-6 PR-0 (see Directory.Build.props:9,:21). The build
      # below therefore already enforces warnings-as-errors, so the extra step was a
      # duplicate full-solution build on every back-end submission.
      - run: dotnet build HealthcareSupport.CaseEvaluation.slnx --no-restore -c Release

  docs-structure:
    name: "Docs: Structure Check"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify documentation structure
        run: python .claude/scripts/verify_structure.py
      - name: Check documentation links
        run: python .claude/scripts/check-links.py || true
        # Link check is non-blocking: pre-existing broken links (tracked in
        # docs/verification/BASELINE.md) should not fail CI. The job still
        # prints the full report for visibility.

  backend-test:
    name: "Backend: Test"
    runs-on: ubuntu-latest
    needs: [changes, backend-build]
    # Gated on its build, whose condition already encodes the path logic.
    # always() so a failed classifier does not skip it; the build must have
    # SUCCEEDED, so a skipped or failed build still skips the test.
    if: ${{ always() && needs.backend-build.result == 'success' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/common.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Generate NuGet.Config
        run: sed "s/\${ABP_NUGET_API_KEY}/${{ secrets.ABP_NUGET_API_KEY }}/" NuGet.Config.template > NuGet.Config
      - name: Create placeholder secrets files
        run: |
          for dir in src/HealthcareSupport.CaseEvaluation.AuthServer \
                     src/HealthcareSupport.CaseEvaluation.HttpApi.Host \
                     src/HealthcareSupport.CaseEvaluation.DbMigrator \
                     test/HealthcareSupport.CaseEvaluation.TestBase \
                     test/HealthcareSupport.CaseEvaluation.HttpApi.Client.ConsoleTestApp; do
            if [ -n "${{ secrets.ABP_LICENSE_CODE }}" ]; then
              echo "{\"AbpLicenseCode\": \"${{ secrets.ABP_LICENSE_CODE }}\"}" > "$dir/appsettings.secrets.json"
            else
              echo '{}' > "$dir/appsettings.secrets.json"
            fi
          done
      - run: dotnet restore HealthcareSupport.CaseEvaluation.slnx
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage
      # Item 2.10. This mirrors the WRAPPING pattern at sonarcloud.yml:148, not
      # its format. That line emits `-f xml` (the Visual Studio format) because
      # SonarCloud reads it via sonar.cs.vscoveragexml.reportsPaths; the floors
      # gate parses Cobertura. Two workflows, two artefacts, two formats -- both
      # gitignored. The inner command is single-quoted so its own --logger
      # quotes survive being passed through as one argument.
      - name: Test
        run: >
          dotnet-coverage collect
          'dotnet test HealthcareSupport.CaseEvaluation.slnx
          --no-restore -c Release
          --logger "trx;LogFileName=results.trx"
          --results-directory ./test-results'
          -f cobertura -o coverage.cobertura.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: ./test-results
          retention-days: 14
      # if: always() is load-bearing, not defensive. The gate must be able to
      # tell "the test job failed" apart from "the report is absent". Uploading
      # only on success collapses those into one indistinguishable state, which
      # is the exact hole item 2.10 exists to close.
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.cobertura.xml
          retention-days: 14

  frontend-build:
    name: "Frontend: Build"
    runs-on: ubuntu-latest
    needs: changes
    # always(): see the note on backend-build.
    if: >-
      ${{ always() && (needs.changes.result != 'success'
      || needs.changes.outputs.frontend == 'true'
      || needs.changes.outputs.shared == 'true'
      || needs.changes.outputs.unclassified == 'true') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: angular/yarn.lock
      # Yarn 4 (Berry) is pinned via package.json packageManager; corepack
      # activates it (must run after setup-node, before any yarn command).
      - run: corepack enable
      - run: yarn install
      - run: yarn build:prod

  frontend-lint:
    name: "Frontend: Lint"
    runs-on: ubuntu-latest
    needs: changes
    # always(): see the note on backend-build.
    if: >-
      ${{ always() && (needs.changes.result != 'success'
      || needs.changes.outputs.frontend == 'true'
      || needs.changes.outputs.shared == 'true'
      || needs.changes.outputs.unclassified == 'true') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: angular/yarn.lock
      # Yarn 4 (Berry) is pinned via package.json packageManager; corepack
      # activates it (must run after setup-node, before any yarn command).
      - run: corepack enable
      - run: yarn install
      - run: yarn lint

  frontend-test:
    name: "Frontend: Test"
    runs-on: ubuntu-latest
    needs: [changes, frontend-build]
    # See the note on backend-test.
    if: ${{ always() && needs.frontend-build.result == 'success' }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: angular/yarn.lock
      # Yarn 4 (Berry) is pinned via package.json packageManager; corepack
      # activates it (must run after setup-node, before any yarn command).
      - run: corepack enable
      - run: yarn install
      - name: Check for test files
        id: check-tests
        # Phase A/B behavior: emit a ::warning annotation when no *.spec.ts
        # files exist (visible in PR UI, not a red ✗). The test step below
        # is gated on has_tests so we skip rather than run yarn test with
        # nothing to execute. Once Phase B #8 adds specs for the 13
        # untested entities, this branch stops firing and the job is a
        # normal green test run.
        #
        # Phase C hardens this: revert to ::error + exit 1 in the else
        # branch, and drop the if-guard on "Run tests with coverage" so
        # the job fails hard if specs are ever removed.
        run: |
          if find src -name "*.spec.ts" | grep -q .; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
            echo "Found spec files; proceeding with tests." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No *.spec.ts files found under angular/src. Phase A/B: informational; Phase C will require specs."
          fi
      - name: Run tests with coverage
        if: steps.check-tests.outputs.has_tests == 'true'
        run: yarn test --watch=false --browsers=ChromeHeadless --code-coverage
      # Item 2.10. `path` is repo-relative on purpose: defaults.run.working-directory
      # applies to `run` steps only, never to `uses` steps, so `coverage/**` here
      # would resolve against the workspace root and silently upload nothing.
      #
      # if: always() for the reason given in backend-test, plus one specific to
      # this job: the coverage step above is gated on has_tests, so if the specs
      # ever disappear it is SKIPPED while the job still reports success and no
      # lcov is written. That is a check reporting success without having run.
      # Uploading unconditionally is what lets the gate see the absence and fail
      # on it rather than inherit the false green.
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: angular/coverage/**/lcov.info
          retention-days: 14

  backend-format:
    name: "Backend: Format Check"
    runs-on: ubuntu-latest
    needs: changes
    # always(): the classifier's OWN failure must not skip this job. If it
    # cannot classify, run -- the same deny-by-default rule as `unclassified`.
    if: >-
      ${{ always() && (needs.changes.result != 'success'
      || needs.changes.outputs.backend == 'true'
      || needs.changes.outputs.shared == 'true'
      || needs.changes.outputs.unclassified == 'true') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/common.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Generate NuGet.Config
        run: sed "s/\${ABP_NUGET_API_KEY}/${{ secrets.ABP_NUGET_API_KEY }}/" NuGet.Config.template > NuGet.Config
      - name: Create placeholder secrets files
        run: |
          for dir in src/HealthcareSupport.CaseEvaluation.AuthServer \
                     src/HealthcareSupport.CaseEvaluation.HttpApi.Host \
                     src/HealthcareSupport.CaseEvaluation.DbMigrator \
                     test/HealthcareSupport.CaseEvaluation.TestBase \
                     test/HealthcareSupport.CaseEvaluation.HttpApi.Client.ConsoleTestApp; do
            if [ -n "${{ secrets.ABP_LICENSE_CODE }}" ]; then
              echo "{\"AbpLicenseCode\": \"${{ secrets.ABP_LICENSE_CODE }}\"}" > "$dir/appsettings.secrets.json"
            else
              echo '{}' > "$dir/appsettings.secrets.json"
            fi
          done
      - run: dotnet restore HealthcareSupport.CaseEvaluation.slnx
      - run: dotnet format HealthcareSupport.CaseEvaluation.slnx --no-restore --verify-no-changes --verbosity diagnostic

  frontend-format:
    name: "Frontend: Format Check"
    runs-on: ubuntu-latest
    needs: changes
    # always(): see the note on backend-build.
    if: >-
      ${{ always() && (needs.changes.result != 'success'
      || needs.changes.outputs.frontend == 'true'
      || needs.changes.outputs.shared == 'true'
      || needs.changes.outputs.unclassified == 'true') }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: angular/yarn.lock
      # Yarn 4 (Berry) is pinned via package.json packageManager; corepack
      # activates it (must run after setup-node, before any yarn command).
      - run: corepack enable
      - run: yarn install
      - run: yarn format:check

  coverage-floors:
    name: "Coverage: Floors"
    runs-on: ubuntu-latest
    needs: [changes, backend-test, frontend-test]
    # `if: always()` with NO further condition, and that is the whole point of
    # this job. Every other job in this file is conditional, and a SKIPPED job
    # reports "Success" and does not block a merge even when it is a required
    # check (catalogue instance 12). A coverage gate that inherits that
    # conditionality passes by not running, which is the single defect item 2.10
    # exists to prevent. So this job always runs and decides applicability
    # itself, below, where absent input is a hard failure rather than an absent
    # constraint.
    if: always()
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Absolute per-stack line coverage floors, measured through the shared
      # .coverage-exclusions list that sonarcloud.yml also consumes. One list,
      # two readers: two lists drift, and a drift means two gates disagree with
      # nobody able to say which is right.
      #
      # FRONTEND -- measured, never guessed:
      #   scripts/coverage-gate.py --measure-only \
      #     --lcov angular/coverage/CaseEvaluation/lcov.info --lcov-prefix angular
      #   -> frontend: 69.46% (1713/2466 lines over 82 files)
      #   measured on feat/ci-coverage-floors @ d2d9a0d9, 667 specs all passing.
      #   It is trustworthy because the UNFILTERED read of that same file
      #   reproduces karma's own 67.44% summary exactly, which validates the
      #   parser rather than merely the number. Set a little under the
      #   measurement so the gate cannot fail on floating-point equality against
      #   the very tree it was measured from.
      FLOOR_FRONTEND: "69.40"
      # BACKEND -- MEASURED, by the mechanism above. This was deliberately unset
      # until 2026-09-03 so the gate's own first run would fail and print the
      # figure, which is exactly what happened:
      #
      #   run 97ea9356  backend: measured 73.61% (33197/45098 lines over 887 files)
      #
      # 887 is the load-bearing number, not the percentage. It is the count of
      # this repo's tracked, non-excluded .cs files present in the report, and it
      # confirms both contamination exclusions matched: 1082 would mean neither,
      # 951 only the third-party one, 1012 only the generated one.
      #
      # WHY 73.55 AND NOT 73.61. The printed figure is rounded; the comparison is
      # not. Two runs of the SAME code measured 33197/45098 = 73.6108% and
      # 33195/45098 = 73.6064% -- both print as "73.61%", and a floor of 73.61
      # PASSES the first and FAILS the second. Two lines of ordinary test
      # nondeterminism is 0.0044 points, so a floor set to the rounded value sits
      # inside the noise and the gate flakes with no code change. That is a
      # mystery-failure generator, and it would be blamed on the gate.
      #
      # 73.55 sits ~12x the observed jitter below the lower measurement, and
      # matches the 0.06 margin used for the frontend. It still constrains: any
      # real regression moves the figure far more than this.
      FLOOR_BACKEND: "73.55"
      # The changed-lines floor, per Adrian's settled decision and the EARS
      # criterion in 02-enforcement.md. Unlike the two absolute floors this one
      # is a fixed policy number rather than a measurement, so it is set here
      # rather than discovered by a first run.
      FLOOR_CHANGED: "90"
    steps:
      - uses: actions/checkout@v4
        with:
          # Required by the changed-lines floor: it diffs against the merge base
          # with the base branch, which a shallow clone does not contain. The
          # step below fails loudly rather than silently measuring nothing if
          # the base ref is somehow still unresolvable.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # continue-on-error belongs on these two steps and nowhere else in this
      # job. A stack that legitimately did not run has no artefact, and
      # download-artifact failing is not itself the verdict -- the verdict is
      # reached explicitly in "Evaluate floors", which fails when a report is
      # absent while its stack is applicable. This is STEP level: job-level
      # continue-on-error would mask the job's conclusion, the opposite of what
      # this gate is for.
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: backend-coverage
          path: artifacts/backend

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frontend-coverage
          path: artifacts/frontend

      - name: Evaluate floors
        env:
          CLASSIFIER_RESULT: ${{ needs.changes.result }}
          CHANGED_BACKEND: ${{ needs.changes.outputs.backend }}
          CHANGED_FRONTEND: ${{ needs.changes.outputs.frontend }}
          CHANGED_SHARED: ${{ needs.changes.outputs.shared }}
          CHANGED_UNCLASSIFIED: ${{ needs.changes.outputs.unclassified }}
          BACKEND_TEST_RESULT: ${{ needs.backend-test.result }}
          FRONTEND_TEST_RESULT: ${{ needs.frontend-test.result }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Deny by default, exactly as backend-build's own `if:` does. If the
          # classifier did not itself succeed we cannot trust a word of its
          # output, so every stack is treated as applicable and must produce a
          # report. `unclassified` is included for the same reason: item 0.5
          # made an unrecognised path run the full suite, so this gate has to
          # agree with that or it contradicts the classifier it depends on.
          applicable() {
            [ "$CLASSIFIER_RESULT" != "success" ] && return 0
            [ "$1" = "true" ] && return 0
            [ "$CHANGED_SHARED" = "true" ] && return 0
            [ "$CHANGED_UNCLASSIFIED" = "true" ] && return 0
            return 1
          }

          fail=0

          # Resolve by search rather than by a fixed path. upload-artifact@v4
          # roots an artefact at the least common ancestor of the files it
          # matched, so a glob matching one file yields a different layout than
          # one matching two. Searching by name is indifferent to that.
          #
          # Three deliberate details, each of which was wrong in a first draft:
          #  - NO `2>/dev/null`. Suppressing find's stderr would report "no
          #    report" for a permission error exactly as for a genuine absence,
          #    and the gate would then fail for the wrong stated reason. The
          #    only EXPECTED absence is the directory itself, so that is tested
          #    explicitly and everything else stays loud.
          #  - `-print -quit` rather than `| head -1`. Under `pipefail` a pipe
          #    into head fails the whole pipeline when find is killed by SIGPIPE
          #    after the first match, which `set -e` would turn into a silent
          #    step abort with no diagnostic at all.
          #  - returns empty, not an error, when the directory is missing. That
          #    is the normal case for a stack whose job was skipped, and the
          #    verdict on it belongs to check_stack, not here.
          find_report() {
            if [ ! -d "$1" ]; then
              return 0
            fi
            find "$1" -type f -name "$2" -print -quit
          }

          BACKEND_REPORT="$(find_report artifacts/backend coverage.cobertura.xml)"
          FRONTEND_REPORT="$(find_report artifacts/frontend lcov.info)"

          check_stack() {
            label="$1"; changed="$2"; result="$3"; report="$4"
            if applicable "$changed"; then
              echo "$label: APPLICABLE (classifier=$CLASSIFIER_RESULT changed=$changed shared=$CHANGED_SHARED unclassified=$CHANGED_UNCLASSIFIED)"
              if [ "$result" != "success" ]; then
                # Built across several assignments purely to keep the source
                # lines short; the annotation itself must stay on ONE line,
                # because a literal newline inside ::error:: truncates it.
                m="$label coverage is applicable to this change, but its test"
                m="$m job reported '$result' rather than 'success'. Refusing to"
                m="$m draw a coverage conclusion from a run that did not complete."
                echo "::error::$m"
                fail=1
                return 0
              fi
              if [ -z "$report" ]; then
                m="$label coverage is applicable and its test job succeeded, yet"
                m="$m no coverage report was uploaded. A missing report is a"
                m="$m FAILURE here, never an absent constraint -- that is"
                m="$m precisely how a gate comes to pass without measuring anything."
                echo "::error::$m"
                fail=1
                return 0
              fi
              echo "$label: report at $report"
            else
              echo "$label: NOT APPLICABLE"
              # 'skipped' is the only coherent result for a stack this change
              # does not touch. 'failure' or 'cancelled' means something ran and
              # went wrong, and must never be read as "nothing to check here".
              if [ "$result" != "skipped" ]; then
                m="$label coverage is not applicable to this change, so its test"
                m="$m job should have been 'skipped', but it reported '$result'."
                m="$m That combination is incoherent and is treated as a failure"
                m="$m rather than as an absent constraint."
                echo "::error::$m"
                fail=1
              fi
            fi
            return 0
          }

          check_stack backend "$CHANGED_BACKEND" "$BACKEND_TEST_RESULT" "$BACKEND_REPORT"
          check_stack frontend "$CHANGED_FRONTEND" "$FRONTEND_TEST_RESULT" "$FRONTEND_REPORT"

          if [ "$fail" -ne 0 ]; then
            echo "::error::Coverage gate failed on input validity before any floor was evaluated."
            exit 1
          fi

          args=()
          if applicable "$CHANGED_BACKEND"; then
            # --cobertura-prefix is left at its empty default pending the first
            # real CI run. The path shape dotnet-coverage writes into Cobertura
            # has not been observed here, and the shared exclusions only match
            # if it is repo-relative. The measured line and file counts printed
            # below are what confirm it: a wrong prefix shows up as an
            # implausible file count, not as an error.
            args+=(--cobertura "$BACKEND_REPORT" --floor-backend "$FLOOR_BACKEND")
          fi
          if applicable "$CHANGED_FRONTEND"; then
            # karma writes `SF:src\app\...` -- backslashes, and relative to
            # angular/, not to the repo root. Without this prefix the shared
            # exclusions match nothing and the gate silently measures 67.44%
            # instead of 69.46% while looking entirely correct.
            args+=(--lcov "$FRONTEND_REPORT" --lcov-prefix angular --floor-frontend "$FLOOR_FRONTEND")
          fi

          if [ "${#args[@]}" -eq 0 ]; then
            echo "Neither stack is applicable to this change; both test jobs were correctly skipped."
            echo "Coverage floors: nothing to evaluate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The changed-lines floor. Added only once at least one stack is
          # applicable, because 90% of the changed lines is a question about
          # coverage reports, and with none of them present there is nothing to
          # ask it of.
          #
          # `...` is deliberate: two dots would also attribute every change that
          # landed on the base branch since this one was cut. The empty case is
          # handled inside the gate, which exits 0 when no CHANGED line is
          # coverable -- a docs-only submission must not fail this.
          base="origin/${BASE_REF}"
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            m="cannot resolve '$base', so the changed-lines floor has nothing to"
            m="$m diff against. This needs fetch-depth: 0 on checkout. Failing"
            m="$m rather than skipping the check, which would pass silently."
            echo "::error::$m"
            exit 1
          fi
          git diff --unified=0 --diff-filter=ACMR "$base...HEAD" > changed.diff
          echo "changed-lines: diffed against $base"
          args+=(--changed-diff changed.diff --floor-changed "$FLOOR_CHANGED")

          # NOT piped into tee, and the exit code is carried by hand. Under
          # `pipefail` a failing gate would abort the step immediately and the
          # step summary below would never be written -- and the first run of
          # this job FAILS BY DESIGN, so that is precisely the run whose measured
          # backend figure somebody needs to read.
          set +e
          python scripts/coverage-gate.py --exclusions .coverage-exclusions "${args[@]}" > gate-output.txt 2>&1
          gate_rc=$?
          set -e
          cat gate-output.txt
          {
            echo "### Coverage floors"
            echo ""
            echo '```text'
            cat gate-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$gate_rc"
