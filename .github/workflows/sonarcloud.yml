name: SonarCloud

on:
  pull_request:
    branches:
      [
        main,
        development,
        staging,
        production,
        chore/dependency-updates,
        "feat/**",
        "fix/**",
      ]
  push:
    branches: [main]

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  analyze:
    name: "SonarCloud: Analysis"
    runs-on: ubuntu-latest
    # NOT flipped in phase 2.1: never poisoned, so not made blocking. The `|| true`
    # removal below stands (it was masking nothing) but this job still does not gate.
    continue-on-error: true
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: angular/yarn.lock

      - name: Install .NET sonar tooling
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage

      - name: Generate NuGet.Config
        run: sed "s/\${ABP_NUGET_API_KEY}/${{ secrets.ABP_NUGET_API_KEY }}/" NuGet.Config.template > NuGet.Config

      - name: Create placeholder secrets files
        run: |
          for dir in src/HealthcareSupport.CaseEvaluation.AuthServer \
                     src/HealthcareSupport.CaseEvaluation.HttpApi.Host \
                     src/HealthcareSupport.CaseEvaluation.DbMigrator \
                     test/HealthcareSupport.CaseEvaluation.TestBase \
                     test/HealthcareSupport.CaseEvaluation.HttpApi.Client.ConsoleTestApp; do
            if [ -n "${{ secrets.ABP_LICENSE_CODE }}" ]; then
              echo "{\"AbpLicenseCode\": \"${{ secrets.ABP_LICENSE_CODE }}\"}" > "$dir/appsettings.secrets.json"
            else
              echo '{}' > "$dir/appsettings.secrets.json"
            fi
          done

      - name: Angular tests with coverage
        working-directory: angular
        run: |
          corepack enable
          yarn install --immutable
          yarn test --watch=false --browsers=ChromeHeadless --code-coverage
        # Phase 2.1 (2026-09-02): `|| true` removed. Its comment claimed this
        # tolerated a silent skip because "most features have no specs yet" --
        # stale. The suite runs 667 specs and emits coverage (67.44% of lines on
        # the run checked), so the tolerance was masking nothing and would have
        # hidden a genuine frontend-test failure from the analysis.
        # LCOV lands in angular/coverage/**/lcov.info.

      # ONE LIST, TWO CONSUMERS -- and until 2026-09-03 that was only half true.
      #
      # `.coverage-exclusions` announced itself in its own header as "read by
      # BOTH .github/workflows/sonarcloud.yml and scripts/coverage-gate.py".
      # This workflow never read it; it carried a hardcoded copy of the same
      # patterns. The two were byte-identical, which is exactly why nobody
      # noticed -- and the moment item 2.10 added two backend patterns they
      # diverged, which is precisely the drift the list's own header warns
      # about. This step makes the claim true rather than softening the claim.
      #
      # Verified before shipping: the generated string reproduces the previous
      # hardcoded value exactly, plus the two new patterns and nothing else.
      - name: Build the shared coverage-exclusion list
        run: |
          set -euo pipefail
          list=$(grep -v '^[[:space:]]*#' .coverage-exclusions \
                 | grep -v '^[[:space:]]*$' | paste -sd, -)
          # Absent input is a hard failure. An empty list here would silently
          # analyse with NO coverage exclusions and move every figure, which is
          # the same shape as a gate that passes by not running.
          if [ -z "$list" ]; then
            m="No patterns read from .coverage-exclusions. Refusing to analyse"
            m="$m with an empty exclusion list, which would silently change"
            m="$m every coverage figure this project reports."
            echo "::error::$m"
            exit 1
          fi
          echo "COVERAGE_EXCLUSIONS=$list" >> "$GITHUB_ENV"
          echo "Coverage exclusions: $list"

      - name: SonarScanner begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"gesco-healthcare-support_hcs-patient-portal"
          /o:"gesco-healthcare-support"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml"
          /d:sonar.javascript.lcov.reportPaths="angular/coverage/**/lcov.info"
          /d:sonar.typescript.lcov.reportPaths="angular/coverage/**/lcov.info"
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/node_modules/**,**/dist/**,angular/src/app/proxy/**,**/Migrations/**,**/TenantMigrations/**,**/*.abstract.*.ts,design_handoff_*/**"
          /d:sonar.coverage.exclusions="$COVERAGE_EXCLUSIONS"
          /d:sonar.issue.ignore.multicriteria=abpModelState,abpLookupLabel,abpLookupLabelHtml,abpDiAppServiceParams,abpDiManagerParams,abpDiRepoParams,abpPermissionStrings,abpAppServiceI18nKeys,abpHostModuleConfigKeys,abpDavailComplexity,bootstrapModalDialogRole,emailDoctype,emailTitle,emailLang,emailTableHeader,emailMouseKeyboard,emailDeprecatedAttrs,emailLayoutTable
          /d:sonar.issue.ignore.multicriteria.abpModelState.ruleKey=csharpsquid:S6967
          /d:sonar.issue.ignore.multicriteria.abpModelState.resourceKey=**/*.cs
          /d:sonar.issue.ignore.multicriteria.abpLookupLabel.ruleKey=Web:S6853
          /d:sonar.issue.ignore.multicriteria.abpLookupLabel.resourceKey=**/*.cshtml
          /d:sonar.issue.ignore.multicriteria.abpLookupLabelHtml.ruleKey=Web:S6853
          /d:sonar.issue.ignore.multicriteria.abpLookupLabelHtml.resourceKey=**/*.html
          /d:sonar.issue.ignore.multicriteria.abpDiAppServiceParams.ruleKey=csharpsquid:S107
          /d:sonar.issue.ignore.multicriteria.abpDiAppServiceParams.resourceKey=**/*AppService.cs
          /d:sonar.issue.ignore.multicriteria.abpDiManagerParams.ruleKey=csharpsquid:S107
          /d:sonar.issue.ignore.multicriteria.abpDiManagerParams.resourceKey=**/*Manager.cs
          /d:sonar.issue.ignore.multicriteria.abpDiRepoParams.ruleKey=csharpsquid:S107
          /d:sonar.issue.ignore.multicriteria.abpDiRepoParams.resourceKey=**/I*Repository.cs
          /d:sonar.issue.ignore.multicriteria.abpPermissionStrings.ruleKey=csharpsquid:S1192
          /d:sonar.issue.ignore.multicriteria.abpPermissionStrings.resourceKey=**/CaseEvaluationPermission*.cs
          /d:sonar.issue.ignore.multicriteria.abpAppServiceI18nKeys.ruleKey=csharpsquid:S1192
          /d:sonar.issue.ignore.multicriteria.abpAppServiceI18nKeys.resourceKey=**/*AppService.cs
          /d:sonar.issue.ignore.multicriteria.abpHostModuleConfigKeys.ruleKey=csharpsquid:S1192
          /d:sonar.issue.ignore.multicriteria.abpHostModuleConfigKeys.resourceKey=**/CaseEvaluationHttpApi*Module.cs
          /d:sonar.issue.ignore.multicriteria.abpDavailComplexity.ruleKey=csharpsquid:S3776
          /d:sonar.issue.ignore.multicriteria.abpDavailComplexity.resourceKey=**/DoctorAvailabilities/DoctorAvailabilitiesAppService.cs
          /d:sonar.issue.ignore.multicriteria.bootstrapModalDialogRole.ruleKey=Web:S6819
          /d:sonar.issue.ignore.multicriteria.bootstrapModalDialogRole.resourceKey=**/*.component.html
          /d:sonar.issue.ignore.multicriteria.emailDoctype.ruleKey=Web:DoctypePresenceCheck
          /d:sonar.issue.ignore.multicriteria.emailDoctype.resourceKey=**/NotificationTemplates/EmailBodies/*.html
          /d:sonar.issue.ignore.multicriteria.emailTitle.ruleKey=Web:PageWithoutTitleCheck
          /d:sonar.issue.ignore.multicriteria.emailTitle.resourceKey=**/NotificationTemplates/EmailBodies/*.html
          /d:sonar.issue.ignore.multicriteria.emailLang.ruleKey=Web:S5254
          /d:sonar.issue.ignore.multicriteria.emailLang.resourceKey=**/NotificationTemplates/EmailBodies/*.html
          /d:sonar.issue.ignore.multicriteria.emailTableHeader.ruleKey=Web:S5256
          /d:sonar.issue.ignore.multicriteria.emailTableHeader.resourceKey=**/NotificationTemplates/EmailBodies/*.html
          /d:sonar.issue.ignore.multicriteria.emailMouseKeyboard.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
          /d:sonar.issue.ignore.multicriteria.emailMouseKeyboard.resourceKey=**/NotificationTemplates/EmailBodies/*.html
          /d:sonar.issue.ignore.multicriteria.emailDeprecatedAttrs.ruleKey=Web:S1827
          /d:sonar.issue.ignore.multicriteria.emailDeprecatedAttrs.resourceKey=**/NotificationTemplates/EmailBodies/*.html
          /d:sonar.issue.ignore.multicriteria.emailLayoutTable.ruleKey=Web:S5257
          /d:sonar.issue.ignore.multicriteria.emailLayoutTable.resourceKey=**/NotificationTemplates/EmailBodies/*.html
          /d:sonar.qualitygate.wait=false

      - run: dotnet restore HealthcareSupport.CaseEvaluation.slnx

      - run: dotnet build HealthcareSupport.CaseEvaluation.slnx --no-restore -c Release

      - name: Backend tests with coverage
        run: dotnet-coverage collect "dotnet test HealthcareSupport.CaseEvaluation.slnx --no-build -c Release" -f xml -o coverage.xml

      - name: SonarScanner end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
