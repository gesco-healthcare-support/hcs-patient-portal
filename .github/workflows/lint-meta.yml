name: Lint Meta

# YAML workflow and Markdown documentation lint. Fast feedback on CI / docs
# drift.
#
# Both jobs BLOCK as of 2026-09-02 (production-hardening phase 2.1). They were
# `continue-on-error: true` pending "Phase C"; that condition has been met.
#
# yamllint was verified green on recent runs before being flipped. markdownlint
# was NOT: it only appeared green because it was linting zero files. It blocks
# on the markdown a submission CHANGES -- see the job comment below.

on:
  pull_request:
    branches:
      [
        main,
        development,
        staging,
        production,
        chore/dependency-updates,
        "feat/**",
        "fix/**",
      ]

permissions:
  contents: read

jobs:
  yamllint:
    name: "Lint: YAML workflows"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows/
          config_data: |
            extends: default
            rules:
              line-length: { max: 200, level: warning }
              truthy: { check-keys: false }
              document-start: disable
              comments-indentation: disable

  markdownlint:
    name: "Lint: Markdown"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Phase 2.1 (2026-09-02): lints ONLY the markdown a submission changes.
      #
      # Two failure modes were found and both are avoided here. The globs were
      # previously one space-separated string, which the action treated as a single
      # glob: it matched nothing and reported "Linting: 0 file(s) / 0 error(s)" --
      # permanently GREEN while checking nothing. Fixing that revealed 5,271
      # pre-existing violations across 431 files, which would have made this
      # permanently RED instead. A check that is always red teaches people to ignore
      # red just as effectively as one that is always green.
      #
      # Changed-files-only lands the gate NOW without waiting for the backlog: new
      # and edited docs must be clean, and the 5,271 wait for the phase that handles
      # backlogs. This is a reusable pattern -- see 02-enforcement.md.
      - name: Lint the markdown this submission changes
        run: |
          base="origin/${{ github.base_ref }}"
          files=$(git diff --name-only --diff-filter=ACMR "$base...HEAD" -- '*.md')
          if [ -z "$files" ]; then
            echo "No markdown files changed by this pull request. Nothing to lint."
            exit 0
          fi
          echo "Linting:"
          echo "$files" | sed 's/^/  /'
          echo "$files" | xargs npx --yes markdownlint-cli2@0.13.0 --config .markdownlint.json
