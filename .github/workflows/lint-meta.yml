name: Lint Meta

# YAML workflow and Markdown documentation lint. Fast feedback on CI / docs
# drift.
#
# Both jobs BLOCK as of 2026-09-02 (production-hardening phase 2.1). They were
# `continue-on-error: true` pending "Phase C"; that condition has been met and
# both were verified green on recent runs before being flipped.

on:
  pull_request:
    branches:
      [
        main,
        development,
        staging,
        production,
        chore/dependency-updates,
        "feat/**",
        "fix/**",
      ]

permissions:
  contents: read

jobs:
  yamllint:
    name: "Lint: YAML workflows"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows/
          config_data: |
            extends: default
            rules:
              line-length: { max: 200, level: warning }
              truthy: { check-keys: false }
              document-start: disable
              comments-indentation: disable

  markdownlint:
    name: "Lint: Markdown"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # NOT flipped to blocking in phase 2.1, deliberately. Fixing the globs above
    # revealed 5,271 pre-existing violations across 431 files -- the check had been
    # green only because it was linting nothing. Making it block would turn every
    # PR red on a backlog this task is not scoped to fix. It now REPORTS honestly
    # and still does not gate; flipping it needs its own item.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          # Phase 2.1 (2026-09-02): globs MUST be newline-separated. As a single
          # space-separated string the action treated the whole line as one glob,
          # matched nothing, and reported "Linting: 0 file(s) / Summary: 0 error(s)"
          # -- permanently green while checking no files at all. Found by poisoning.
          globs: |
            docs/**/*.md
            README.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            CHANGELOG.md
          config: ".markdownlint.json"
