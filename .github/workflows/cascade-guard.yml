name: Cascade Guard

# A CASCADE INTO `development` MUST BE A MERGE COMMIT, NEVER A SQUASH.
#
# The rule already existed; nothing enforced it. `auto-pr-dev.yml` writes
# "Review and merge (merge commit) to promote" into the PR body -- prose only --
# and the repository has `allow_squash_merge: true`, so the squash button sits
# right next to the merge button on every cascade PR.
#
# On 2026-09-16 cascade #907 was squashed. `0cfad7d0` has one parent, so
# `development` ended up holding main's CONTENT but none of its COMMITS, and the
# branches read as diverged. The next cascade PR then presented 62 files when
# only 14 differed -- 48 of them with no content difference whatsoever. Nothing
# in the code was wrong. The promotion PR was simply unreviewable, and a real
# problem could have hidden inside a diff nobody trusts.
#
# A squashed cascade is detectable with certainty rather than heuristically: a
# merge commit has two or more parents, a squash has exactly one.
#
# This is the second of two layers. The first is a repository setting
# restricting merge methods on `development`, which is applied separately. This
# job catches it if that setting is ever relaxed, and says why it matters at the
# moment someone is looking.
#
# WHY ITS OWN WORKFLOW: `ci.yml` triggers on `pull_request` plus `push` to
# `main` only, never `push` to `development`. Adding `development` to that push
# list would run the entire suite on every promotion, which is a far larger
# change than this warrants.
#
# ---------------------------------------------------------------------------
# SECOND RULE, ADDED 2026-09-21: THE CASCADE MUST NOT RUN BACKWARDS INTO `main`.
#
# `development` is NEVER merged into `main`. The cascade runs one way only.
#
# The guard above could not see a violation of that rule, in three independent
# ways, so it was not a gap in its logic but outside its field of view: it
# triggers on `push` to `development` and a backwards merge lands on `main`; it
# matches the subject `ci(sync): promote main to development` and a backwards
# merge reads `Merge branch 'development' into main`; and its test fails a commit
# with FEWER than two parents, while a backwards merge has exactly two, so even
# if examined it would be logged as `ok: is a merge`.
#
# WHERE IT COMES FROM. Cascade PR `main -> development` has base `development`
# and head `main`. GitHub's "Update branch" button merges the BASE into the HEAD,
# so on a cascade PR it merges `development` into `main` and commits straight to
# `main`. The button is offered precisely when the PR reads BEHIND, which is the
# state it exists to clear, so the control that looks like the fix is the one
# that corrupts the direction.
#
# IT HAS HAPPENED TEN TIMES, not once. An audit of main's history on 2026-09-21
# found ten `Merge branch 'development' into main` commits. Nine changed nothing.
# ONE did: `83c639de` (2026-07-30) added a file, since removed. So no runtime
# code has ever bypassed a PR this way -- but that is a fact about what happened
# to be on `development` each time, not about anything preventing it.
#
# MEASURE IT WITH THE TREE, NOT WITH ANCESTRY, if this is ever re-audited.
# "Was `development` an ancestor of main's side" answers whether COMMITS moved,
# not whether CONTENT did, and it reports every one of the ten as harmful. The
# honest test is `<merge>^{tree}` against `<merge>^1^{tree}`.
#
# WHY THIS IS A CI CHECK AND NOT BRANCH PROTECTION. Protection cannot express
# it. No setting distinguishes merge DIRECTION, and the two candidates both fail:
#   - `required_linear_history` on `main` would block the backwards merge, and
#     would also block the legitimate 2-parent epic promotions `93a88b68` (#956)
#     and `a044b06e` (#930), forcing every future epic promotion to squash. That
#     is exactly what #987 did, which is why the epic tip is not an ancestor of
#     `main`. It would institutionalise the failure it appears to fix.
#   - restricting merge METHODS cannot help: the backwards merge IS a merge.
# So detection as it lands is not a compromise chosen over prevention; it is the
# only mechanism available. The guard above reaches the same conclusion for the
# same reason.
#
# WHY SUBJECT MATCHING AND NOT A STRUCTURAL TEST. A structural test -- "second
# parent reachable from `development`" -- produces FALSE POSITIVES on exactly the
# commits that must stay legal. After any cascade, `development` contains
# everything `main` does, including commits that arrived via an epic promotion,
# so that promotion's second parent becomes reachable from `development` and the
# test flags it. The subject, by contrast, is generated by GitHub and is not
# editable in the UI flow that produces it, which makes it the reliable signal
# here. Same reasoning as the subject match above.

on:
  push:
    branches: [development, main]

permissions:
  contents: read

jobs:
  cascade-is-a-merge:
    name: "Cascade: promotion is a merge"
    # Gated because this workflow now triggers on two branches. Without it this
    # job runs on every `main` push and reports "no cascade commits", which is
    # noise in the one place the other job's signal has to be readable.
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Full history: the check reads parent counts, and a shallow clone
          # reports truncated parents, which would silently read a merge as a
          # squash and fail honest promotions.
          fetch-depth: 0

      - name: Cascade commits must have two parents
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.sha }}
        run: |
          # `set +e` FIRST, for the same reason ci.yml's migration steps document
          # at length: GitHub invokes this as `bash -e {0}`, and an assignment
          # from a command substitution takes the substitution's exit status, so
          # under -e the shell dies at exactly the moment the check finds what it
          # is looking for.
          set +e
          set -uo pipefail

          # The subject auto-pr-dev.yml:58 gives every cascade PR. A squash merge
          # keeps it as the commit subject, which is what makes this detectable.
          CASCADE_SUBJECT_RE='^ci\(sync\): promote main to development'
          ZERO='0000000000000000000000000000000000000000'

          check_range() {
            range="$1"
            if ! commits=$(git rev-list "$range" 2>&1); then
              echo "::error::Cascade guard could not list '$range'. This is NOT a pass -- read the error: $commits"
              return 2
            fi

            bad=0
            checked=0
            for c in $commits; do
              subject=$(git log -1 --format='%s' "$c")
              printf '%s' "$subject" | grep -Eq "$CASCADE_SUBJECT_RE" || continue

              checked=$((checked + 1))
              # %P is the space-separated parent list. One parent means squash.
              nparents=$(git log -1 --format='%P' "$c" | wc -w)

              if [ "$nparents" -lt 2 ]; then
                echo "::group::squashed cascade: $c"
                git log -1 --format='  %h  parents=%P%n  %s' "$c"
                echo "::endgroup::"
                m="Cascade commit $(git rev-parse --short "$c") has $nparents parent and must have at least 2."
                m="$m It was SQUASH-merged. development now holds main's content but not its"
                m="$m commits, so the branches read as diverged and the next promotion PR will"
                m="$m present every file main has touched since they last shared history --"
                m="$m unreviewable, and a real defect can hide in it. Promote main to"
                m="$m development with a MERGE COMMIT. Never squash, never rebase."
                echo "::error::$m"
                bad=$((bad + 1))
              else
                echo "  ok: $(git rev-parse --short "$c") is a merge ($nparents parents)"
              fi
            done

            [ "$checked" -eq 0 ] && echo "  no cascade commits in $range"
            [ "$bad" -gt 0 ] && return 1
            return 0
          }

          if [ -z "$EVENT_BEFORE" ] || [ "$EVENT_BEFORE" = "$ZERO" ]; then
            # NEW BRANCH OR UNKNOWN BASE: EXAMINE ONLY THE TIP, NEVER HISTORY.
            #
            # The obvious fallback -- scanning `origin/main..$AFTER` -- is WRONG,
            # and testing rather than reasoning is what showed it. development's
            # history permanently contains the squashed cascade 0cfad7d0: it stays
            # reachable as a parent of the repair commit and is never on main, so
            # that range would flag it on every run, forever. This job would be red
            # from the day it merged, for a defect already fixed.
            #
            # ci.yml:99-101 makes the argument in those words for the classifier:
            # "a check that is permanently red teaches people to ignore the colour.
            # That is worse than no check."
            #
            # This guard exists to catch a squash AS IT LANDS, so the tip is the
            # whole question. Repairing history is a different job.
            check_range "${EVENT_AFTER}~1..${EVENT_AFTER}"
          else
            check_range "${EVENT_BEFORE}..${EVENT_AFTER}"
          fi
          rc=$?

          case "$rc" in
            0) echo "Cascade history is intact." ;;
            1) echo "::error::A cascade commit was squashed. See above." ;;
            *) echo "::error::The cascade guard could not run. Treating as failure." ;;
          esac
          exit "$rc"

  no-backwards-merge:
    name: "Cascade: no backwards merge into main"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Full history for the same reason as the job above, plus one specific
          # to this check: it reports whether the merge moved CONTENT by comparing
          # trees, and a shallow clone cannot resolve `<commit>^1`.
          fetch-depth: 0

      - name: No commit on main may merge development
        env:
          EVENT_AFTER: ${{ github.sha }}
        run: |
          # `set +e` FIRST, for the reason the job above documents: GitHub invokes
          # this as `bash -e {0}`, an assignment from a command substitution takes
          # the substitution's exit status, and under -e the shell would die at
          # exactly the moment the check finds what it is looking for.
          set +e
          set -uo pipefail

          # Every spelling of the same mistake. GitHub's "Update branch" button
          # produces the first; the git CLI produces the remote-tracking forms.
          # Matched on the SUBJECT rather than structurally -- see the header for
          # why a structural test false-positives on legal epic promotions.
          BACKWARDS_RE="^Merge (remote-tracking )?branch '(origin/)?development'"

          # THE TIP ONLY, DELIBERATELY -- NOT A RANGE. Two range spellings were
          # tried and BOTH fail, which is why this reads as simply as it does:
          #
          #   `X~1..X`  is wrong because for a MERGE commit it means "reachable
          #             from X but not from its FIRST parent" -- i.e. the whole
          #             branch brought in by the second parent. The commit hunted
          #             here is itself a merge, so that is the normal case.
          #   `BEFORE..AFTER`  is wrong for the same underlying reason: when a
          #             merge lands on main, main's prior tip IS its first parent,
          #             so the range again spans everything the second parent
          #             carried.
          #
          # Both were found by TESTING against real history, not by reading: each
          # one swept `e6b4093d` (a backwards merge from July) into the check for
          # `a044b06e` (#930, "repair cascade ancestry"), failing a legal and
          # intentional promotion. A legitimate repair PR can carry a historical
          # backwards merge in through its second parent, and failing that PR
          # would make this guard the obstacle rather than the safeguard.
          #
          # Checking the tip alone has no such failure mode and loses nothing
          # real: "Update branch" always produces main's NEW TIP, so the tip IS
          # the threat. A hand-crafted backwards merge buried mid-stack is not
          # what this guards, and pretending to cover it was what created the
          # false positives.
          #
          # This also removes the `github.event.before` zero-SHA fallback the
          # sibling job needs, along with that whole branch of reasoning.
          c="$EVENT_AFTER"

          if ! subject=$(git log -1 --format='%s' "$c" 2>&1); then
            echo "::error::Backwards-merge guard could not read commit '$c'. This is NOT a pass -- read the error: $subject"
            exit 2
          fi

          if ! printf '%s' "$subject" | grep -Eq "$BACKWARDS_RE"; then
            echo "Tip $(git rev-parse --short "$c") is not a backwards merge."
            echo "  subject: $subject"
            exit 0
          fi

          # Report whether CONTENT actually moved, using the tree comparison
          # rather than ancestry. Ancestry answers whether commits moved and
          # calls every one of these harmful; the tree is the honest test.
          tree_merge=$(git rev-parse "${c}^{tree}")
          tree_first=$(git rev-parse "${c}^1^{tree}" 2>/dev/null)

          echo "::group::backwards merge on main: $c"
          git log -1 --format='  %h  parents=%P%n  %s' "$c"
          if [ -n "$tree_first" ] && [ "$tree_merge" = "$tree_first" ]; then
            echo "  content: NONE moved -- tree identical to main's side (empty merge)"
          else
            echo "  content: MOVED -- files differing from main's side:"
            git diff --name-only "${c}^1" "$c" | sed 's/^/    /'
          fi
          echo "::endgroup::"

          m="Commit $(git rev-parse --short "$c") merges development into main."
          m="$m The cascade runs ONE WAY: main -> development, never back. This is what"
          m="$m GitHub's \"Update branch\" button does on a cascade PR, because that PR's"
          m="$m head IS main, so the button merges the base into the head. Do not press it"
          m="$m on a cascade PR -- close and recreate the PR instead, or merge main into"
          m="$m development through the normal cascade PR. If the group above says content"
          m="$m MOVED, those files reached main without review: revert this commit and"
          m="$m bring them up through a PR."
          echo "::error::$m"
          exit 1
