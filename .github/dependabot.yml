version: 2

# All version-update PRs target the long-lived chore/dependency-updates
# integration branch, NOT main. See
# docs/superpowers/specs/2026-05-21-dependency-integration-branch-design.md
# for the policy.
#
# PACKAGE version-update PRs (nuget, both npm) are disabled via
# open-pull-requests-limit: 0 until ABP Commercial supports Angular 20.3+.
# Security advisories (configured in repo settings, independent of this file)
# continue to flow into the integration branch regardless of the limit. The
# limit was briefly raised in #212 to recover four orphan PRs after the
# target-branch change; it was restored to 0 so future weekly scans do not
# surface unwanted bumps. THAT CONSTRAINT IS STILL LIVE -- do not raise those
# three.
#
# GITHUB-ACTIONS IS DIFFERENT, and was changed in phase 2 item 2.2 (2026-09-03).
# It had inherited the same 0 without the reason applying: the ABP/Angular
# constraint is an npm concern and says nothing about GitHub Actions. The
# ecosystem was DECLARED but produced no update pull requests at all, so a grep
# for "github-actions" reported it covered while nothing was ever opened.
#
# That mattered the moment 2.2 pinned all 69 `uses:` references to commit SHAs.
# A SHA pin is immutable by design, so without version updates nothing would
# ever propose moving one, and the pins would freeze until a security advisory
# happened to fire -- discovered, if ever, by someone asking why an action had
# not moved in a year. Pinning without a refresh path is a slow freeze rather
# than a supply-chain improvement.
#
# Adrian ruled: lift the cap for this ecosystem ONLY, accepting the weekly PR
# cost because they land on chore/dependency-updates rather than the main line.
#
# DOCKER was added in phase 2 item 2.14 (2026-09-04), for the same reason as
# github-actions: item 2.14 pinned the five SHIPPING images to
# `image:tag@sha256:digest`, and a digest is immutable, so without version
# updates nothing would ever propose moving one. Docker gets no Dependabot
# security updates at all -- version updates are the ONLY thing that will ever
# refresh these pins.
#
# WHY `image:tag@sha256:digest` AND NOT THE DIGEST ALONE. SonarCloud's
# docker:S8431 says to use one or the other, and it has half a point: once a
# digest is present the tag decides nothing, and a tag edited without its digest
# would read as a lie. Kept anyway, deliberately. A digest-only reference is the
# form Dependabot handles WORST -- it can produce no pull request at all
# (dependabot-core#4419) -- so dropping the tag to satisfy the rule would strand
# the pins this entry exists to keep moving. The tag also tells a reader which
# release they are looking at, which `@sha256:a4556ed0...` does not. THE DIGEST
# IS WHAT RESOLVES; if you change one, change both.
#
# EVERY stage is pinned since 2026-09-25 (decision 17), build and dev stages
# included. They never ship, but they PRODUCE what ships: a floating build image
# means two builds of one commit can differ, and a compromised tag reaches the
# publish output. The `ignore` entries that exempted `dotnet/sdk` and `node` were
# removed so this entry now refreshes those pins too. The AuthServer's Node
# binaries come from a named `node-runtime` stage for the same reason: this
# ecosystem reads `FROM` lines only, so a digest behind `COPY --from=<image>`
# could never be refreshed.

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels: ["dependencies", "backend"]
    target-branch: "chore/dependency-updates"

  - package-ecosystem: "npm"
    directory: "/angular"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels: ["dependencies", "frontend"]
    target-branch: "chore/dependency-updates"

  - package-ecosystem: "npm"
    directory: "/src/HealthcareSupport.CaseEvaluation.AuthServer"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels: ["dependencies", "backend"]
    target-branch: "chore/dependency-updates"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # 5 is Dependabot's own default, not a number picked here. It is what keeps
    # the SHA pins in .github/workflows/ refreshable; see the note at the top of
    # this file for why this ecosystem alone is not 0.
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    target-branch: "chore/dependency-updates"

  - package-ecosystem: "docker"
    # An explicit list, not a glob. `directories` accepts `*`, but how glob
    # expansion treats a directory with no Dockerfile was not verified, and the
    # six paths are stable. `directory: "/"` would NOT work: the fetcher reads
    # one directory and does not recurse, and the repository root holds no
    # Dockerfile -- the entry would fail rather than find nothing quietly.
    directories:
      - "/angular"
      - "/docker/docs-site"
      - "/docker/packet-renderer"
      - "/src/HealthcareSupport.CaseEvaluation.AuthServer"
      - "/src/HealthcareSupport.CaseEvaluation.DbMigrator"
      - "/src/HealthcareSupport.CaseEvaluation.HttpApi.Host"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    target-branch: "chore/dependency-updates"

  # .NET SDK pin in global.json (B8, 2026-09-25). CI installs exactly this SDK
  # (setup-dotnet `global-json-file`) and the images pin the matching
  # `sdk:<version>` tag, so a bump here and the docker entry's sdk bump belong
  # together: rollForward latestPatch lets either land first within one feature
  # band, but a new band needs both. Version updates are ON for the same reason
  # as github-actions: an exact pin with no refresh path freezes.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    target-branch: "chore/dependency-updates"

  # The packet renderer's hash-pinned requirements.txt, compiled by pip-compile
  # from requirements.in (decision 18; B8, 2026-09-25). Dependabot recompiles the
  # whole file, hashes included. Version updates ON: the ABP/Angular constraint
  # that keeps nuget and npm at 0 says nothing about this service.
  - package-ecosystem: "pip"
    directory: "/docker/packet-renderer"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    target-branch: "chore/dependency-updates"

  # The images the compose files run directly (SQL Server, Redis, MinIO, nginx,
  # and clamd once uploads are scanned). The `docker` entry above reads only
  # Dockerfiles, so without this nothing ever proposed moving a compose image.
  # One directory covers both files: the fetcher matches
  # /(docker-)?compose(-[\w]+)?(?>\.[\w-]+)?\.ya?ml/i (dependabot-core,
  # docker/lib/dependabot/docker_compose/file_fetcher.rb), i.e. docker-compose.yml
  # and docker-compose.prod.yml. Added 2026-09-25 (B8).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    target-branch: "chore/dependency-updates"
    ignore:
      # MinIO stays where it is. The release that fixes its open advisory was
      # published as source only, and both registries now refuse anonymous
      # pulls of these images (measured 2026-09-30), so a bump would name a tag
      # the server cannot pull and the deploy would fail. Moving the documents
      # off MinIO is the real fix, not a version bump here.
      # NAMES ARE UNQUALIFIED ON PURPOSE. Dependabot names a docker dependency
      # from the image alone and keeps the registry in the requirement source
      # (dependabot-core shared_file_parser.rb), so `quay.io/minio/minio`
      # would match nothing and the bumps would arrive anyway.
      - dependency-name: "minio/minio"
      - dependency-name: "minio/mc"
